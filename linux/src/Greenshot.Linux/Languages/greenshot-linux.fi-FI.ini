ai_consent_note=Kuvakaappaukset voivat sisältää mitä tahansa näytölläsi näkyvää. Pois suljettujen sovellusten (oletuksena salasanojen hallintaohjelmat) ikkunoita ei koskaan jaeta. Voit muuttaa molempia Greenshotin asetuksissa, Tekoälytyökalut-välilehdellä.
