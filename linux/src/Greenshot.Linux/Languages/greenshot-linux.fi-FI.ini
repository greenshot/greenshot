ai_enabled_description=Tekoälytyökalut (kuten Claude Code tai muokkain, jossa on tekoälyavustaja) yhdistävät greenshot-mcp:n kautta, joka asennetaan Greenshotin mukana. Ne voivat luetella ikkunasi, ottaa kuvakaappauksia ja suorittaa reseptejäsi. Kun tämä on pois päältä, Greenshot hylkää jokaisen pyynnön kysymättä. Jokainen ohjelma tarvitsee silti luvan, kun se yhdistää ensimmäisen kerran.
