ai_excluded_description=Näiden sovellusten ikkunoita ei koskaan luetella tekoälytyökaluille, ja ne mustataan niiden kuvakaappauksissa. Käytä prosessin nimeä tai sovellustunnusta (kuten keepassxc tai org.keepassxc.KeePassXC), kirjainkoolla ei ole väliä.
ai_excluded_unsupported=Tämä työpöytä ({0}) ei kerro Greenshotille, missä ikkunat ovat, joten tekoälytyökalut eivät voi ottaa kuvakaappauksia niin kauan kuin tämä luettelo ei ole tyhjä. Sway ja Hyprland kertovat sen.
