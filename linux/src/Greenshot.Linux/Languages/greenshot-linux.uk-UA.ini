ai_enabled_description=Інструменти ШІ (як-от Claude Code або редактор із ШІ-помічником) підключаються через greenshot-mcp, який встановлюється разом із Greenshot. Вони можуть отримувати список Ваших вікон, робити знімки екрана і запускати Ваші рецепти. Поки це вимкнено, Greenshot відхиляє кожен запит, не питаючи. Кожна програма все одно потребує Вашого дозволу під час першого підключення.
