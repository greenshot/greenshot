ai_enabled_description=Les ferramentes d'IA (com Claude Code o un editor en un assistent d'IA) es connecten per mig de greenshot-mcp, que s'instala en Greenshot. Poden llistar les seues finestres, fer captures de pantalla i eixecutar les seues receptes. Mentres açò estiga desactivat, Greenshot rebuja totes les sol·licituts sense preguntar. Aixina i tot, cada programa necessita el seu permís la primera volta que es connecta.
ai_mcp_setup=Afija Greenshot a la seua ferramenta d'IA com a servidor MCP (stdio) en este comando:
ai_mcp_missing=No s'ha trobat greenshot-mcp al costat de Greenshot ({0}); forma part de la instalació.
ai_excluded_description=Les finestres d'estes aplicacions mai es llisten per a les ferramentes d'IA i es tapen en negre en les seues captures de pantalla. Use el nom del procés o l'id de l'aplicació (com keepassxc o org.keepassxc.KeePassXC); no importen les mayúscules ni les minúscules.
ai_excluded_unsupported=Este escriptori ({0}) no indica a Greenshot a on estan les finestres, per tant les ferramentes d'IA no poden fer captures de pantalla mentres esta llista no estiga buida. Sway i Hyprland sí que ho indiquen.
