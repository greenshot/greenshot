ai_enabled_description=AI-værktøjer (som Claude Code eller en editor med en AI-assistent) forbinder via greenshot-mcp, som installeres sammen med Greenshot. De kan vise dine vinduer, tage skærmbilleder og køre dine opskrifter. Så længe dette er slået fra, afviser Greenshot alle anmodninger uden at spørge. Hvert program skal stadig have din tilladelse, første gang det forbinder.
