ai_excluded_description=Vinduer fra disse programmer vises aldrig for AI-værktøjer og sværtes ud i deres skærmbilleder. Brug procesnavnet eller app-id'et (som keepassxc eller org.keepassxc.KeePassXC), store og små bogstaver er ligegyldige.
