ai_consent_note=Las capturas de pantalla pueden contener cualquier cosa visible en tu pantalla. Las ventanas de las aplicaciones excluidas (por defecto, los gestores de contraseñas) nunca se comparten. Puedes cambiar ambas cosas en la configuración de Greenshot, en la pestaña Herramientas de IA.
