ai_mcp_missing=No se encontró greenshot-mcp junto a Greenshot ({0}); forma parte de la instalación.
ai_excluded_description=Las ventanas de estas aplicaciones nunca se listan para las herramientas de IA y aparecen tapadas en negro en sus capturas de pantalla. Usa el nombre del proceso o el id de la aplicación (como keepassxc u org.keepassxc.KeePassXC); no importan mayúsculas ni minúsculas.
ai_excluded_unsupported=Este escritorio ({0}) no indica a Greenshot dónde están las ventanas, así que las herramientas de IA no pueden hacer capturas de pantalla mientras esta lista no esté vacía. Sway e Hyprland sí lo indican.
