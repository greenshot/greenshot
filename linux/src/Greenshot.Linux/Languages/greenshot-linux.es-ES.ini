ai_enabled_description=Las herramientas de IA (como Claude Code o un editor con asistente de IA) se conectan mediante greenshot-mcp, que se instala con Greenshot. Pueden listar tus ventanas, hacer capturas de pantalla y ejecutar tus recetas. Mientras esto esté desactivado, Greenshot rechaza todas las solicitudes sin preguntar. Aun así, cada programa necesita tu permiso la primera vez que se conecta.
