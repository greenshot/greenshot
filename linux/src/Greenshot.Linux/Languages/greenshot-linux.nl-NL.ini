ai_consent_note=Schermopnamen kunnen alles bevatten wat op uw scherm zichtbaar is. Vensters van uitgesloten toepassingen (standaard wachtwoordbeheerders) worden nooit gedeeld. U kunt beide wijzigen in de instellingen van Greenshot, op het tabblad AI-tools.
