ai_enabled_description=AI-tools (zoals Claude Code of een editor met een AI-assistent) maken verbinding via greenshot-mcp, dat met Greenshot wordt geïnstalleerd. Ze kunnen uw vensters weergeven, schermopnamen maken en uw recepten uitvoeren. Zolang dit uit staat, weigert Greenshot elk verzoek zonder te vragen. Elk programma heeft nog steeds uw toestemming nodig wanneer het voor het eerst verbinding maakt.
ai_mcp_setup=Voeg Greenshot met deze opdracht als MCP-server (stdio) toe aan uw AI-tool:
ai_mcp_missing=greenshot-mcp is niet gevonden naast Greenshot ({0}), het maakt deel uit van de installatie.
ai_excluded_description=Vensters van deze toepassingen worden nooit weergegeven aan AI-tools en worden in hun schermopnamen zwart gemaakt. Gebruik de procesnaam of de app-ID (zoals keepassxc of org.keepassxc.KeePassXC), hoofdletters maken niet uit.
ai_excluded_unsupported=Dit bureaublad ({0}) vertelt Greenshot niet waar vensters zijn, dus AI-tools kunnen geen schermopnamen maken zolang deze lijst niet leeg is. Sway en Hyprland vertellen het wel.
