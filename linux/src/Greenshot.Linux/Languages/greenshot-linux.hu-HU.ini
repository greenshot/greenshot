ai_excluded_unsupported=Ez az asztali környezet ({0}) nem közli a Greenshottal, hol vannak az ablakok, így az MI-eszközök nem készíthetnek képernyőképet, amíg ez a lista nem üres. A Sway és a Hyprland közli.
