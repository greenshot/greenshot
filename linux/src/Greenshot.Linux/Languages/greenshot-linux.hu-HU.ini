ai_enabled_description=Az MI-eszközök (például a Claude Code vagy egy MI-asszisztenssel rendelkező szerkesztő) a greenshot-mcp-n keresztül csatlakoznak, amely a Greenshottal együtt települ. Listázhatják az ablakait, képernyőképeket készíthetnek és futtathatják a receptjeit. Amíg ez ki van kapcsolva, a Greenshot kérdés nélkül elutasít minden kérést. Minden programnak az első csatlakozáskor így is szüksége van az Ön engedélyére.
