ai_consent_note=Les captures d'écran peuvent contenir tout ce qui est visible à l'écran. Les fenêtres des applications exclues (par défaut les gestionnaires de mots de passe) ne sont jamais partagées. Vous pouvez modifier ces deux points dans les paramètres de Greenshot, onglet Outils d'IA.
ai_consent_question=Autoriser {0} à utiliser Greenshot ?
ai_consent_allow=Autoriser
ai_consent_deny=Ne pas autoriser
ai_enabled_description=Les outils d'IA (comme Claude Code ou un éditeur avec un assistant IA) se connectent via greenshot-mcp, installé avec Greenshot. Ils peuvent lister vos fenêtres, prendre des captures d'écran et exécuter vos recettes. Tant que cette option est désactivée, Greenshot refuse toute demande sans poser de question. Chaque programme a quand même besoin de votre autorisation lors de sa première connexion.
ai_mcp_setup=Ajoutez Greenshot à votre outil d'IA comme serveur MCP (stdio) avec cette commande :
ai_mcp_missing=greenshot-mcp est introuvable à côté de Greenshot ({0}), il fait partie de l'installation.
ai_excluded_description=Les fenêtres de ces applications ne sont jamais listées pour les outils d'IA et sont masquées en noir dans leurs captures d'écran. Utilisez le nom du processus ou l'identifiant de l'application (comme keepassxc ou org.keepassxc.KeePassXC), majuscules et minuscules n'ont pas d'importance.
ai_excluded_unsupported=Ce bureau ({0}) n'indique pas à Greenshot où se trouvent les fenêtres, les outils d'IA ne peuvent donc pas prendre de captures d'écran tant que cette liste n'est pas vide. Sway et Hyprland l'indiquent.
ai_excluded_add_tooltip=Un nom de processus ou un identifiant d'application, comme keepassxc ; Enter l'ajoute

