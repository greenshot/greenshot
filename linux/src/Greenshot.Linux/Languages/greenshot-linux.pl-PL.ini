ai_enabled_description=Narzędzia AI (takie jak Claude Code lub edytor z asystentem AI) łączą się przez greenshot-mcp, instalowany razem z Greenshotem. Mogą wyświetlać listę Twoich okien, wykonywać zrzuty ekranu i uruchamiać Twoje przepisy. Gdy to jest wyłączone, Greenshot odrzuca każde żądanie bez pytania. Każdy program i tak potrzebuje Twojej zgody przy pierwszym połączeniu.
