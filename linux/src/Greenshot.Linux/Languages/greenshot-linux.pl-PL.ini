ai_excluded_description=Okna tych aplikacji nigdy nie są pokazywane narzędziom AI i są zaczerniane na ich zrzutach ekranu. Użyj nazwy procesu lub app id (np. keepassxc lub org.keepassxc.KeePassXC), wielkość liter nie ma znaczenia.
ai_excluded_unsupported=To środowisko pulpitu ({0}) nie informuje Greenshota, gdzie są okna, więc narzędzia AI nie mogą wykonywać zrzutów ekranu, dopóki ta lista nie jest pusta. Sway i Hyprland to robią.
