ai_consent_program=Ahil: {0}
ai_consent_note=Tuṭṭfiwin n ugdil zemrent ad gbrent kullec i d-yettbanen ɣef ugdil-inek. Isfuyla n yisnasen yettwasbeɛden (imsefrak n wawalen uffiren s wudem amezwer) ur ttwabḍan ara akk. Tzemreḍ ad tbeddleḍ sin-nsen deg yiɣewwaṛen n Greenshot, deg yiccer Ifecka AI.
