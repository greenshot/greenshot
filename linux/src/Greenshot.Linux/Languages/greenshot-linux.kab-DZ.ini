ai_consent_deny=Ur ssireg ara
ai_enabled_description=Ifecka AI (am Claude Code neɣ amaẓrag s umalal AI) qqnen s greenshot-mcp, i yettwasbedden akked Greenshot. Zemren ad d-beddren isfuyla-inek, ad ṭṭfen agdil, ad selkemen iserwasen-inek. Mi ara yens waya, Greenshot yugi yal asuter war asteqsi. Yal ahil yesra mazal tasiregt-inek tikelt tamezwarut ara yeqqen.
ai_mcp_setup=Rnu Greenshot ɣer ufecku-inek AI am uqeddac MCP (stdio) s tladna-agi:
ai_mcp_missing=greenshot-mcp ulac-it ɣer yidis n Greenshot ({0}), d aḥric seg usebded.
ai_excluded_description=Isfuyla n yisnasen-agi ur ttwabedren ara akk i yifecka AI, ttwasbeɛlen s uberkan deg tuṭṭfiwin-nsen n ugdil. Seqdec isem n ukala neɣ asulay n usnas (am keepassxc neɣ org.keepassxc.KeePassXC), isekkilen imeqqranen d imecṭuḥen ur ttwaḥsaben ara.
ai_excluded_unsupported=Tanarit-agi ({0}) ur tettini ara i Greenshot anida llan yisfuyla, ihi ifecka AI ur zmiren ara ad ṭṭfen agdil ma tabdart-agi mačči d tilemt. Sway d Hyprland ttinin-as-t.
ai_excluded_add_tooltip=Isem n ukala neɣ asulay n usnas, am keepassxc; Enter yerna-t

