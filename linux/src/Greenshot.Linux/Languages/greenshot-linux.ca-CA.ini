ai_enabled_description=Les eines d'IA (com Claude Code o un editor amb un assistent d'IA) es connecten mitjançant greenshot-mcp, que s'instal·la amb Greenshot. Poden llistar les vostres finestres, fer captures de pantalla i executar les vostres receptes. Mentre això estigui desactivat, Greenshot rebutja totes les sol·licituds sense preguntar. Tot i així, cada programa necessita el vostre permís la primera vegada que es connecta.
ai_mcp_setup=Afegiu Greenshot a la vostra eina d'IA com a servidor MCP (stdio) amb aquesta ordre:
ai_mcp_missing=No s'ha trobat greenshot-mcp al costat de Greenshot ({0}); forma part de la instal·lació.
ai_excluded_description=Les finestres d'aquestes aplicacions mai no es llisten per a les eines d'IA i es tapen en negre a les seves captures de pantalla. Feu servir el nom del procés o l'id de l'aplicació (com keepassxc o org.keepassxc.KeePassXC); no importen les majúscules ni les minúscules.
ai_excluded_unsupported=Aquest escriptori ({0}) no indica a Greenshot on són les finestres, per tant les eines d'IA no poden fer captures de pantalla mentre aquesta llista no estigui buida. Sway i Hyprland sí que ho indiquen.
