ai_consent_note=Les captures de pantalla poden contenir qualsevol cosa visible a la pantalla. Les finestres de les aplicacions excloses (per defecte, els gestors de contrasenyes) no es comparteixen mai. Podeu canviar totes dues coses a la configuració de Greenshot, a la pestanya Eines d'IA.
