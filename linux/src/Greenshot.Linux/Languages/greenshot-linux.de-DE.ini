ai_enabled_description=KI-Tools (wie Claude Code oder ein Editor mit KI-Assistent) verbinden sich über greenshot-mcp, das mit Greenshot installiert wird. Sie können Ihre Fenster auflisten, Screenshots aufnehmen und Ihre Rezepte ausführen. Solange dies ausgeschaltet ist, lehnt Greenshot jede Anfrage ab, ohne zu fragen. Jedes Programm braucht trotzdem Ihre Erlaubnis, wenn es sich zum ersten Mal verbindet.
