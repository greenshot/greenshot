ai_mcp_missing=greenshot-mcp wurde nicht neben Greenshot gefunden ({0}), es ist Teil der Installation.
ai_excluded_description=Fenster dieser Anwendungen werden KI-Tools nie aufgelistet und in deren Screenshots geschwärzt. Verwenden Sie den Prozessnamen oder die App-ID (wie keepassxc oder org.keepassxc.KeePassXC), Groß- und Kleinschreibung spielt keine Rolle.
ai_excluded_unsupported=Dieser Desktop ({0}) teilt Greenshot nicht mit, wo Fenster sind, daher können KI-Tools keine Screenshots aufnehmen, solange diese Liste nicht leer ist. Sway und Hyprland teilen es mit.
