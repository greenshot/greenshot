ai_consent_program=Программа: {0}
ai_consent_note=Снимки экрана могут содержать всё, что видно на экране. Окна исключённых приложений (по умолчанию менеджеров паролей) никогда не передаются. Оба параметра можно изменить в настройках Greenshot на вкладке «Инструменты ИИ».
ai_consent_question=Разрешить {0} использовать Greenshot?
ai_consent_allow=Разрешить
ai_consent_deny=Не разрешать
ai_enabled_description=Инструменты ИИ (например Claude Code или редактор с ИИ-ассистентом) подключаются через greenshot-mcp, который устанавливается вместе с Greenshot. Они могут получать список ваших окон, делать снимки экрана и запускать ваши рецепты. Пока это выключено, Greenshot отклоняет любой запрос, не спрашивая. Каждой программе всё равно нужно ваше разрешение при первом подключении.
ai_mcp_setup=Добавьте Greenshot в ваш инструмент ИИ как MCP-сервер (stdio) с помощью этой команды:
ai_mcp_missing=greenshot-mcp не найден рядом с Greenshot ({0}), он входит в установку.
ai_excluded_description=Окна этих приложений никогда не показываются инструментам ИИ и закрашиваются чёрным на их снимках экрана. Используйте имя процесса или app id (например keepassxc или org.keepassxc.KeePassXC), регистр не важен.
ai_excluded_unsupported=Это рабочее окружение ({0}) не сообщает Greenshot, где находятся окна, поэтому инструменты ИИ не могут делать снимки экрана, пока этот список не пуст. Sway и Hyprland это сообщают.
ai_excluded_add_tooltip=Имя процесса или app id, например keepassxc; Enter добавляет его

