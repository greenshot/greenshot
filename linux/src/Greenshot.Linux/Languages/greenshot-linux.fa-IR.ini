ai_enabled_description=ابزارهای هوش مصنوعی (مانند Claude Code یا ویرایشگری با دستیار هوش مصنوعی) از راه greenshot-mcp که همراه Greenshot نصب می‌شود وصل می‌شوند. آن‌ها می‌توانند پنجره‌های شما را فهرست کنند، از صفحه تصویر بگیرند و دستورالعمل‌های شما را اجرا کنند. تا زمانی که این خاموش است، Greenshot هر درخواستی را بدون پرسیدن رد می‌کند. هر برنامه همچنان نخستین باری که وصل می‌شود به اجازه شما نیاز دارد.
ai_mcp_setup=Greenshot را با این فرمان به عنوان سرور MCP (stdio) به ابزار هوش مصنوعی خود اضافه کنید:
ai_mcp_missing=greenshot-mcp کنار Greenshot ({0}) پیدا نشد، این فایل بخشی از نصب است.
ai_excluded_description=پنجره‌های این برنامه‌ها هرگز برای ابزارهای هوش مصنوعی فهرست نمی‌شوند و در تصویرهای آن‌ها سیاه می‌شوند. از نام فرایند یا شناسه برنامه استفاده کنید (مانند keepassxc یا org.keepassxc.KeePassXC)، بزرگی و کوچکی حروف اهمیتی ندارد.
ai_excluded_unsupported=این میزکار ({0}) به Greenshot نمی‌گوید پنجره‌ها کجا هستند، بنابراین تا زمانی که این فهرست خالی نیست ابزارهای هوش مصنوعی نمی‌توانند از صفحه تصویر بگیرند. Sway و Hyprland این را می‌گویند.
ai_excluded_add_tooltip=یک نام فرایند یا شناسه برنامه، مانند keepassxc؛ Enter آن را اضافه می‌کند

