ai_consent_title=Πρόσβαση εργαλείων AI
ai_consent_message=Το {0} θέλει να χρησιμοποιήσει το Greenshot για να εμφανίζει τα παράθυρά σας, να τραβάει στιγμιότυπα οθόνης και να εκτελεί συνταγές του Greenshot.
ai_consent_program=Πρόγραμμα: {0}
ai_consent_note=Τα στιγμιότυπα οθόνης μπορεί να περιέχουν οτιδήποτε είναι ορατό στην οθόνη σας. Τα παράθυρα των εξαιρούμενων εφαρμογών (από προεπιλογή οι διαχειριστές κωδικών) δεν κοινοποιούνται ποτέ. Μπορείτε να αλλάξετε και τα δύο στις ρυθμίσεις του Greenshot, στην καρτέλα Εργαλεία AI.
ai_consent_question=Να επιτραπεί στο {0} να χρησιμοποιεί το Greenshot;
ai_consent_allow=Να επιτρέπεται
ai_consent_deny=Να μην επιτρέπεται
ai_enabled_description=Τα εργαλεία AI (όπως το Claude Code ή ένας επεξεργαστής με βοηθό AI) συνδέονται μέσω του greenshot-mcp, που εγκαθίσταται μαζί με το Greenshot. Μπορούν να εμφανίζουν τα παράθυρά σας, να τραβούν στιγμιότυπα οθόνης και να εκτελούν τις συνταγές σας. Όσο αυτό είναι απενεργοποιημένο, το Greenshot απορρίπτει κάθε αίτημα χωρίς να ρωτήσει. Κάθε πρόγραμμα χρειάζεται πάντως την άδειά σας την πρώτη φορά που συνδέεται.
ai_mcp_setup=Προσθέστε το Greenshot στο εργαλείο AI σας ως διακομιστή MCP (stdio) με αυτή την εντολή:
ai_mcp_missing=Το greenshot-mcp δεν βρέθηκε δίπλα στο Greenshot ({0}), είναι μέρος της εγκατάστασης.
ai_excluded_description=Τα παράθυρα αυτών των εφαρμογών δεν εμφανίζονται ποτέ στα εργαλεία AI και μαυρίζονται στα στιγμιότυπά τους. Χρησιμοποιήστε το όνομα της διεργασίας ή το app id (όπως keepassxc ή org.keepassxc.KeePassXC), τα πεζά και τα κεφαλαία δεν έχουν σημασία.
ai_excluded_unsupported=Αυτή η επιφάνεια εργασίας ({0}) δεν λέει στο Greenshot πού βρίσκονται τα παράθυρα, οπότε τα εργαλεία AI δεν μπορούν να τραβούν στιγμιότυπα οθόνης όσο αυτή η λίστα δεν είναι κενή. Το Sway και το Hyprland το λένε.
ai_excluded_add_tooltip=Ένα όνομα διεργασίας ή app id, όπως keepassxc· το Enter το προσθέτει

