ai_consent_note=As capturas de ecrã podem conter tudo o que estiver visível no seu ecrã. As janelas das aplicações excluídas (por defeito, os gestores de palavras-passe) nunca são partilhadas. Pode alterar ambos nas definições do Greenshot, no separador Ferramentas de IA.
ai_consent_question=Permitir que {0} use o Greenshot?
ai_consent_allow=Permitir
ai_consent_deny=Não permitir
ai_enabled_description=As ferramentas de IA (como o Claude Code ou um editor com assistente de IA) ligam-se através do greenshot-mcp, que é instalado com o Greenshot. Podem listar as suas janelas, fazer capturas de ecrã e executar as suas receitas. Enquanto isto estiver desactivado, o Greenshot recusa todos os pedidos sem perguntar. Cada programa precisa mesmo assim da sua permissão na primeira vez que se liga.
ai_mcp_setup=Adicione o Greenshot à sua ferramenta de IA como servidor MCP (stdio) com este comando:
ai_mcp_missing=O greenshot-mcp não foi encontrado junto ao Greenshot ({0}), faz parte da instalação.
ai_excluded_description=As janelas destas aplicações nunca são listadas para ferramentas de IA e são tapadas a preto nas capturas de ecrã destas. Use o nome do processo ou o id da aplicação (como keepassxc ou org.keepassxc.KeePassXC), maiúsculas e minúsculas são indiferentes.
ai_excluded_unsupported=Este ambiente de trabalho ({0}) não indica ao Greenshot onde estão as janelas, por isso as ferramentas de IA não podem fazer capturas de ecrã enquanto esta lista não estiver vazia. O Sway e o Hyprland indicam-no.
