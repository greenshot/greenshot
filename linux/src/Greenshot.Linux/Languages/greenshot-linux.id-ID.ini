ai_excluded_description=Jendela aplikasi ini tidak pernah ditampilkan untuk alat AI dan dihitamkan dalam tangkapan layarnya. Gunakan nama proses atau app id (seperti keepassxc atau org.keepassxc.KeePassXC), huruf besar dan kecil tidak berpengaruh.
ai_excluded_unsupported=Desktop ini ({0}) tidak memberi tahu Greenshot letak jendela, sehingga alat AI tidak dapat mengambil tangkapan layar selama daftar ini tidak kosong. Sway dan Hyprland memberitahukannya.
