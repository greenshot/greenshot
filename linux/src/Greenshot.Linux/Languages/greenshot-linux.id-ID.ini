ai_enabled_description=Alat AI (seperti Claude Code atau editor dengan asisten AI) terhubung melalui greenshot-mcp, yang terpasang bersama Greenshot. Alat tersebut dapat menampilkan daftar jendela anda, mengambil tangkapan layar, dan menjalankan resep anda. Selama ini mati, Greenshot menolak setiap permintaan tanpa bertanya. Setiap program tetap membutuhkan izin anda saat pertama kali terhubung.
