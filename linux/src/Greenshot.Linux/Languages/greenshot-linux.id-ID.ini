ai_consent_note=Tangkapan layar dapat berisi apa saja yang terlihat di layar anda. Jendela aplikasi yang dikecualikan (pengelola kata sandi secara bawaan) tidak pernah dibagikan. Anda dapat mengubah keduanya di pengaturan Greenshot, pada tab Alat AI.
