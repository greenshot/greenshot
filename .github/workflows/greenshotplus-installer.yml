name: GreenShotPlus installer

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Installer display version (for example 0.8.666); blank uses the application version'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build full application and installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./installer/build-greenshotplus.ps1 -PlatformToolset v143 -ReleaseVersion $env:RELEASE_VERSION
      - name: Check current-user installation and uninstall
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./installer/test-user-install.ps1 -InstallerPath ./installer/GreenShotPlus-Setup.exe -ExpectedVersion $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: GreenShotPlus-Windows-Installer
          path: |
            installer/GreenShotPlus-Setup.exe
            installer/GreenShotPlus-Setup.exe.sha256
          if-no-files-found: error
