name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  claude:
    if: >
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["lakritzator", "jklingen", "larsvegas0815"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 15"
          # Only needed for allowlisted people WITHOUT write access:
          # allowed_non_write_users: "trusted-contrib"
          # github_token: ${{ secrets.GITHUB_TOKEN }}