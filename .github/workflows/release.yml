env:
  IS_MAIN_OR_RELEASE_BRANCH: ${{ startsWith(github.ref, 'refs/heads/release/') || github.ref_name == 'main' }}
  BRANCH_NAME: ${{ github.ref_name }}

name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'release/1.*'
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '*.md'
      - 'LICENSE'
      - 'build-and-deploy.ps1'

jobs:
  # Build Greenshot with MSBuild
  # Upload installer to artifacts-installer
  # Upload build output to artifacts-greenshot-build
  build:
    name: Build Greenshot
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet packages 
      shell: cmd
      run: msbuild src/Greenshot.sln /p:Configuration=Release /restore /t:PrepareForBuild
      env:
        Box14_ClientId: ${{ secrets.Box14_ClientId }}
        Box14_ClientSecret: ${{ secrets.Box14_ClientSecret }}
        DropBox14_ClientId: ${{ secrets.DropBox14_ClientId }}
