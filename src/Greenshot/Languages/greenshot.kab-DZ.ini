setup_version_unknown=Greenshot ur yezmir ara ad yesneqdeḍ lqem amaynut akka tura.
thanks=Tanemmirt imi tesbeddeḍ Greenshot! Yetteddu tura, yettraǧu-k deg temnaṭ n yilɣa, ɣer yidis n tsaɛet.
tip1=Deg tuṭṭfa, sit ɣef Space akken ad tbeddleḍ gar ufran n temnaṭ d tuṭṭfa n usfaylu.
tip2=Deg tuṭṭfa, tisura n yineccaben sembiwilent taḥnaccaṭ s yiwen n upiksil yal tikelt, s Ctrl s 10 n ipiksilen.
tip3=Sit ɣef Z deg tuṭṭfa akken ad tesskneḍ neɣ ad tffreḍ tasemɣart, i ufran s upiksil.
tip4=Sit ɣef M deg tuṭṭfa akken ad tesskneḍ neɣ ad tffreḍ taḥnaccaṭ n tɣerdayt deg tuṭṭfa n ugdil.
tip5=Sit ɣef F1 deg tuṭṭfa akken ad twaliḍ akk tisura i tzemreḍ ad tesseqdceḍ.
tip6=Tbeddleḍ ṛṛay? Esc yessefsax tuṭṭfa.
tip7=Amaẓrag yezmer ad yesdaɛmumec neɣ ad yesslem ipiksilen n yiḥricen n tuṭṭfa n ugdil ur ilaq ad iwali yiwen.
tip8=Seddu uṭṭunen i yisurifen n tmuli s umesmiḍan n umaẓrag.
tip9=Deg yiɣewwaṛen ara tferneḍ akaram d tneɣruft n yisem n ufaylu n tuṭṭfiwin n ugdil yettwaskelsen.
tip10=Greenshot d ilelli, d aɣbalu yeldin, yettwaxdem sɣur iwiziwen. Ma yella k-yettɛawan, ini-as i yimdukal-ik.
tip_next=Tixidest-nniḍen
tip_notification=Tekkseḍ alɣu n Greenshot? Yettraǧu deg temnaṭ n yilɣa n Windows: asiti fell-as ad k-yeǧǧ ad tferneḍ tikelt-nniḍen anida ara teddu tuṭṭfa, ula deffir n umdal n Greenshot.
