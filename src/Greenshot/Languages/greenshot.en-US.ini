hotkeys_snipping_settings_btn=⚙️ Open Windows Keyboard Settings
hotkeys_snipping_desc=In modern Windows 11 updates, Microsoft turned on 'Use the Print screen key to open Snipping Tool' by default. This intercepts PrintScreen before any desktop tool can handle it. Disabling it restores normal PrintScreen functionality.
