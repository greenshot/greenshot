hotkeys_onedrive_disable_btn=🚫 Disable OneDrive Screenshot Interception
hotkeys_onedrive_desc=OneDrive has a setting 'Automatically save screenshots I capture to OneDrive'. When enabled, OneDrive registers PrintScreen before Greenshot. The button above updates the OneDrive settings file and registry to disable this behavior.
