thanks=Thank you for installing Greenshot! It's running now and waits for you in the notification area, next to the clock.
tip1=While capturing, press Space to switch between selecting a region and capturing a window.
tip2=While capturing, the arrow keys move the cursor one pixel at a time, with Ctrl ten pixels.
tip3=Press Z while capturing to show or hide the zoomer, for selections to the pixel.
tip4=Press M while capturing to show or hide the mouse cursor in the screenshot.
tip5=Press F1 while capturing to see all the keys you can use.
tip6=Changed your mind? Esc cancels a capture.
tip7=The editor can pixelate or blur the parts of a screenshot nobody else should see.
tip8=Number the steps of a how-to with the counter of the editor.
tip9=In the settings you choose the folder and the file name pattern of saved screenshots.
tip10=Greenshot is free and open source, made by volunteers. If it helps you, tell your friends about it.
tip_next=Another tip
tip_notification=Clicked away a notification of Greenshot? It waits in the Windows notification center: a click on it lets you choose again where the capture goes, even after Greenshot was closed.
