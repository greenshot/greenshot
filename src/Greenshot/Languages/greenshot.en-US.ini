hotkeys_dropbox_title=Dropbox Screenshot Sharing
hotkeys_dropbox_desc=Dropbox has a feature 'Share screenshots using Dropbox' in Dropbox Preferences > Backups. When enabled, Dropbox claims PrintScreen and Alt+PrintScreen at system startup. If your hotkeys do not respond, open Dropbox Preferences, go to Backups, and uncheck 'Share screenshots using Dropbox'.
