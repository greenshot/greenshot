thanks=Tak fordi du installerede Greenshot! Det kører nu og venter på dig i meddelelsesområdet ved siden af uret.
tip1=Under klip skifter du med Mellemrum mellem at markere et område og at klippe et vindue.
tip2=Under klip flytter piletasterne markøren én pixel ad gangen, med Ctrl ti pixels.
tip3=Tryk på Z under klip for at vise eller skjule forstørrelsesglasset til pixelpræcise markeringer.
tip4=Tryk på M under klip for at vise eller skjule musemarkøren i skærmklippet.
tip5=Tryk på F1 under klip for at se alle de taster, du kan bruge.
tip6=Fortrudt? Esc annullerer et klip.
tip7=Editoren kan pixelere eller sløre de dele af et skærmklip, som ingen andre bør se.
tip8=Nummerér trinene i en vejledning med editorens tæller.
tip9=I indstillingerne vælger du mappen og mønsteret for filnavn for gemte skærmklip.
tip10=Greenshot er gratis og open source, lavet af frivillige. Hvis det hjælper dig, så fortæl dine venner om det.
