hotkeys_snipping_title=Перехват инструментом «Ножницы» Windows 10 / 11
hotkeys_snipping_disable_btn=🚫 Отключить перехват «Ножницами»
hotkeys_snipping_settings_btn=⚙️ Открыть параметры клавиатуры Windows
hotkeys_snipping_desc=В последних обновлениях Windows 11 Microsoft по умолчанию включила параметр «Использовать клавишу Print Screen для запуска инструмента "Ножницы"». Он перехватывает PrintScreen раньше, чем любая программа для рабочего стола успеет её обработать. Отключение этого параметра восстанавливает обычную работу PrintScreen.
hotkeys_snipping_status_disabled=Перехват PrintScreen «Ножницами» Windows отключён (чисто).
hotkeys_snipping_status_enabled=Перехват PrintScreen «Ножницами» Windows сейчас ВКЛЮЧЁН!
