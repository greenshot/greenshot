thanks=Спасибо за установку Greenshot! Он уже работает и ждёт вас в области уведомлений рядом с часами.
tip1=Во время захвата нажмите пробел, чтобы переключаться между выбором области и захватом окна.
tip2=Во время захвата клавиши со стрелками перемещают курсор на один пиксель, а с Ctrl — на десять пикселей.
tip3=Нажмите Z во время захвата, чтобы показать или скрыть лупу для выделения с точностью до пикселя.
tip4=Нажмите M во время захвата, чтобы показать или скрыть указатель мыши на скриншоте.
tip5=Нажмите F1 во время захвата, чтобы увидеть все доступные клавиши.
tip6=Передумали? Esc отменяет захват.
tip7=Редактор может пикселизировать или размыть части скриншота, которые никто не должен видеть.
tip8=Нумеруйте шаги инструкции с помощью счётчика в редакторе.
tip9=В настройках можно выбрать папку и шаблон имени файла для сохраняемых скриншотов.
tip10=Greenshot бесплатен и имеет открытый исходный код, его создают добровольцы. Если он вам помогает, расскажите о нём друзьям.
tip_next=Ещё совет
tip_notification=Случайно закрыли уведомление Greenshot? Оно ждёт в центре уведомлений Windows: щелчок по нему позволяет снова выбрать, куда отправить снимок, даже после закрытия Greenshot.
