hotkeys_onedrive_disable_btn=🚫 Отключить перехват скриншотов OneDrive
hotkeys_onedrive_desc=В OneDrive есть параметр «Автоматически сохранять сделанные мной снимки экрана в OneDrive». Когда он включён, OneDrive регистрирует PrintScreen раньше Greenshot. Кнопка выше изменяет файл настроек OneDrive и реестр, чтобы отключить это поведение.
