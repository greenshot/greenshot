hotkeys_dropbox_title=Обмен скриншотами Dropbox
hotkeys_dropbox_desc=В Dropbox есть функция «Делиться скриншотами с помощью Dropbox» в разделе «Настройки Dropbox > Резервные копии». Когда она включена, Dropbox занимает PrintScreen и Alt+PrintScreen при запуске системы. Если горячие клавиши не реагируют, откройте настройки Dropbox, перейдите в «Резервные копии» и снимите флажок «Делиться скриншотами с помощью Dropbox».
