setup_tray_hidden=Windows skrýva ikonu Greenshotu za šípkou (^) vedľa hodín. Greenshot ju môže zobraziť vedľa hodín za vás, alebo ju môžete zapnúť sami v nastaveniach panela úloh v časti „Ďalšie ikony na paneli úloh“.
