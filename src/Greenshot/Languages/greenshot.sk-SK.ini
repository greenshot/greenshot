thanks=Ďakujeme za inštaláciu Greenshotu! Teraz beží a čaká na vás v oblasti oznámení vedľa hodín.
tip1=Počas zachytenia prepnete medzerníkom medzi výberom oblasti a zachytením okna.
tip2=Počas zachytenia posúvajú šípky kurzor po jednom pixeli, s Ctrl po desiatich pixeloch.
tip3=Stlačením Z počas zachytenia zobrazíte alebo skryjete lupu na výber s presnosťou na pixel.
tip4=Stlačením M počas zachytenia zobrazíte alebo skryjete kurzor myši v snímke obrazovky.
tip5=Stlačením F1 počas zachytenia zobrazíte všetky klávesy, ktoré môžete použiť.
tip6=Rozmysleli ste si to? Esc zachytenie zruší.
tip7=Editor dokáže pixelizovať alebo rozmazať časti snímky obrazovky, ktoré nikto iný nemá vidieť.
tip8=Očíslujte kroky návodu pomocou počítadla v editore.
tip9=V nastaveniach vyberiete priečinok a šablónu názvu súboru ukladaných snímok obrazovky.
tip10=Greenshot je zadarmo a open source, vytváraný dobrovoľníkmi. Ak vám pomáha, povedzte o ňom svojim priateľom.
tip_next=Ďalší tip
tip_notification=Odklikli ste upozornenie Greenshotu? Čaká v centre oznámení Windows: kliknutím naň môžete znova vybrať, kam snímka pôjde, aj keď bol Greenshot zatvorený.
