setup_tray_hidden=Windows ховає піктограму Greenshot за стрілкою (^) поруч із годинником. Greenshot може показати її поруч із годинником за Вас, або Ви можете увімкнути її самі в розділі „Інші піктограми в системному лотку“ в параметрах панелі завдань.
