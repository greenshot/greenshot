hotkeys_dropbox_title=Обмін знімками екрана Dropbox
hotkeys_dropbox_desc=Dropbox має функцію „Ділитися знімками екрана за допомогою Dropbox“ у „Налаштування Dropbox > Резервні копії“. Коли її ввімкнено, Dropbox займає PrintScreen і Alt+PrintScreen під час запуску системи. Якщо гарячі клавіші не реагують, відкрийте налаштування Dropbox, перейдіть до „Резервні копії“ і зніміть позначку „Ділитися знімками екрана за допомогою Dropbox“.
