hotkeys_onedrive_desc=OneDrive має параметр „Автоматично зберігати зроблені мною знімки екрана в OneDrive“. Коли його ввімкнено, OneDrive реєструє PrintScreen раніше за Greenshot. Кнопка вище змінює файл налаштувань OneDrive і реєстр, щоб вимкнути цю поведінку.
