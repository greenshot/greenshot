thanks=Дякуємо за встановлення Greenshot! Він уже працює і чекає на Вас в області сповіщень поруч із годинником.
tip1=Під час захоплення натисніть пробіл, щоб перемикатися між вибором області та захопленням вікна.
tip2=Під час захоплення клавіші зі стрілками переміщують курсор на один піксель, а з Ctrl – на десять пікселів.
tip3=Натисніть Z під час захоплення, щоб показати або сховати лупу для виділення з точністю до пікселя.
tip4=Натисніть M під час захоплення, щоб показати або сховати курсор миші на знімку.
tip5=Натисніть F1 під час захоплення, щоб побачити всі доступні клавіші.
tip6=Передумали? Esc скасовує захоплення.
tip7=Редактор може пікселізувати або розмити частини знімка, які ніхто інший не повинен бачити.
tip8=Нумеруйте кроки інструкції за допомогою лічильника в редакторі.
tip9=У параметрах можна вибрати теку та шаблон назви файла для збережених знімків.
tip10=Greenshot безкоштовний і має відкритий код, його створюють волонтери. Якщо він Вам допомагає, розкажіть про нього друзям.
tip_next=Ще порада
tip_notification=Випадково закрили сповіщення Greenshot? Воно чекає в центрі сповіщень Windows: клацання на ньому дозволяє знову вибрати, куди надіслати знімок, навіть після закриття Greenshot.
tip_title=Чи знали Ви?
