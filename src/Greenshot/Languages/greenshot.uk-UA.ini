hotkeys_snipping_settings_btn=⚙️ Відкрити параметри клавіатури Windows
hotkeys_snipping_desc=В останніх оновленнях Windows 11 Microsoft за замовчуванням увімкнула параметр „Використовувати клавішу Print Screen для відкриття інструмента «Ножиці»“. Він перехоплює PrintScreen раніше, ніж будь-яка настільна програма встигне її обробити. Вимкнення цього параметра відновлює звичайну роботу PrintScreen.
