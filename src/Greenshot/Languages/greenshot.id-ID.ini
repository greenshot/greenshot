thanks=Terima kasih telah memasang Greenshot! Greenshot sekarang berjalan dan menunggu anda di area notifikasi, di sebelah jam.
tip1=Saat menangkap, tekan Space untuk beralih antara memilih daerah dan menangkap jendela.
tip2=Saat menangkap, tombol panah memindahkan kursor satu piksel setiap kali, dengan Ctrl sepuluh piksel.
tip3=Tekan Z saat menangkap untuk menampilkan atau menyembunyikan pembesar, untuk seleksi hingga ke piksel.
tip4=Tekan M saat menangkap untuk menampilkan atau menyembunyikan kursor mouse di tangkapan layar.
tip5=Tekan F1 saat menangkap untuk melihat semua tombol yang dapat anda gunakan.
tip6=Berubah pikiran? Esc membatalkan penangkapan.
tip7=Editor dapat mempikselisasi atau mengaburkan bagian tangkapan layar yang tidak boleh dilihat orang lain.
tip8=Beri nomor pada langkah-langkah panduan dengan penomor di editor.
tip9=Di pengaturan anda memilih folder dan pola nama berkas untuk tangkapan layar yang disimpan.
tip10=Greenshot gratis dan open source, dibuat oleh sukarelawan. Jika membantu anda, ceritakan kepada teman-teman anda.
tip_next=Tips lain
tip_notification=Menutup notifikasi Greenshot? Notifikasi itu menunggu di pusat notifikasi Windows: klik untuk memilih lagi ke mana tangkapan dikirim, bahkan setelah Greenshot ditutup.
