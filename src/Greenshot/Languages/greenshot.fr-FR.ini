hotkeys_snipping_success=La prise de contrôle de la touche Impr. écran par l'Outil Capture d'écran a été désactivée dans le registre Windows.
hotkeys_dropbox_title=Partage de captures d'écran Dropbox
hotkeys_dropbox_desc=Dropbox possède une fonction « Partager des captures d'écran avec Dropbox » dans Préférences Dropbox > Sauvegardes. Lorsqu'elle est activée, Dropbox s'approprie Impr. écran et Alt+Impr. écran au démarrage du système. Si vos raccourcis clavier ne répondent pas, ouvrez les Préférences Dropbox, allez dans Sauvegardes et décochez « Partager des captures d'écran avec Dropbox ».
