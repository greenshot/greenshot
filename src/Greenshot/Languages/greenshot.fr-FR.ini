hotkeys_onedrive_desc=OneDrive possède un paramètre « Enregistrer automatiquement les captures d'écran dans OneDrive ». Lorsqu'il est activé, OneDrive enregistre la touche Impr. écran avant Greenshot. Le bouton ci-dessus met à jour le fichier de paramètres de OneDrive et le registre pour désactiver ce comportement.
