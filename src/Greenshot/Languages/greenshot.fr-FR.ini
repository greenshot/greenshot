hotkeys_snipping_title=Prise de contrôle par l'Outil Capture d'écran de Windows 10 / 11
hotkeys_snipping_disable_btn=🚫 Désactiver la prise de contrôle par l'Outil Capture d'écran
hotkeys_snipping_settings_btn=⚙️ Ouvrir les paramètres du clavier de Windows
hotkeys_snipping_desc=Dans les mises à jour récentes de Windows 11, Microsoft a activé par défaut « Utiliser la touche Impr. écran pour ouvrir l'Outil Capture d'écran ». Cela intercepte la touche Impr. écran avant que tout outil de bureau puisse la traiter. Le désactiver rétablit le fonctionnement normal de la touche Impr. écran.
hotkeys_snipping_status_disabled=La prise de contrôle de la touche Impr. écran par l'Outil Capture d'écran de Windows est désactivée (OK).
