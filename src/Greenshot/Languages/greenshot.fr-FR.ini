thanks=Merci d'avoir installé Greenshot ! Il est maintenant lancé et vous attend dans la zone de notification, à côté de l'horloge.
tip1=Pendant la capture, appuyez sur Espace pour basculer entre la sélection d'une région et la capture d'une fenêtre.
tip2=Pendant la capture, les touches fléchées déplacent le curseur d'un pixel à la fois, de dix pixels avec Ctrl.
tip3=Appuyez sur Z pendant la capture pour afficher ou masquer la loupe, pour des sélections au pixel près.
tip4=Appuyez sur M pendant la capture pour afficher ou masquer le curseur de la souris dans la capture d'écran.
tip5=Appuyez sur F1 pendant la capture pour voir toutes les touches utilisables.
tip6=Vous avez changé d'avis ? Échap annule une capture.
tip7=L'éditeur peut pixéliser ou flouter les parties d'une capture d'écran que personne d'autre ne doit voir.
tip8=Numérotez les étapes d'un tutoriel avec le compteur de l'éditeur.
tip9=Dans les paramètres, vous choisissez le répertoire et le modèle de nom de fichier des captures d'écran enregistrées.
tip10=Greenshot est gratuit et open source, réalisé par des bénévoles. S'il vous est utile, parlez-en à vos amis.
tip_next=Une autre astuce
tip_notification=Vous avez fermé une notification de Greenshot ? Elle vous attend dans le centre de notifications de Windows : un clic dessus vous permet de choisir à nouveau où va la capture, même après la fermeture de Greenshot.
