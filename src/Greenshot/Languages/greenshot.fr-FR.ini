setup_tray_hidden=Windows masque l'icône de Greenshot derrière la flèche (^) à côté de l'horloge. Greenshot peut l'afficher à côté de l'horloge pour vous, ou vous pouvez l'activer vous-même sous « Autres icônes de la barre d'état système » dans les paramètres de la barre des tâches.
