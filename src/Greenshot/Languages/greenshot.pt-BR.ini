hotkeys_dropbox_title=Compartilhamento de capturas de tela do Dropbox
hotkeys_dropbox_desc=O Dropbox tem o recurso 'Compartilhar capturas de tela usando o Dropbox' em Preferências do Dropbox > Backups. Quando ativado, o Dropbox reivindica PrintScreen e Alt+PrintScreen na inicialização do sistema. Se suas teclas de atalho não responderem, abra as Preferências do Dropbox, vá até Backups e desmarque 'Compartilhar capturas de tela usando o Dropbox'.
