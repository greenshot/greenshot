hotkeys_onedrive_desc=O OneDrive tem a configuração 'Salvar automaticamente no OneDrive as capturas de tela que eu fizer'. Quando ativada, o OneDrive registra a tecla PrintScreen antes do Greenshot. O botão acima atualiza o arquivo de configurações e o registro do OneDrive para desativar esse comportamento.
