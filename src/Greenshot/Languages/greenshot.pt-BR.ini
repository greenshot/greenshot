thanks=Obrigado por instalar o Greenshot! Ele já está em execução e aguarda você na área de notificação, ao lado do relógio.
tip1=Durante a captura, pressione Espaço para alternar entre selecionar uma região e capturar uma janela.
tip2=Durante a captura, as setas movem o cursor um pixel por vez, com Ctrl dez pixels.
tip3=Pressione Z durante a captura para mostrar ou ocultar a lupa, para seleções precisas ao pixel.
tip4=Pressione M durante a captura para mostrar ou ocultar o cursor do mouse na captura de tela.
tip5=Pressione F1 durante a captura para ver todas as teclas que você pode usar.
tip6=Mudou de ideia? Esc cancela uma captura.
tip7=O editor pode pixelizar ou desfocar as partes de uma captura de tela que ninguém mais deve ver.
tip8=Numere as etapas de um tutorial com o contador do editor.
tip9=Nas configurações você escolhe a pasta e o formato do nome de arquivo das capturas salvas.
tip10=O Greenshot é gratuito e de código aberto, feito por voluntários. Se ele ajuda você, conte aos seus amigos.
