hotkeys_snipping_settings_btn=⚙️ Abrir as configurações de teclado do Windows
hotkeys_snipping_desc=Em atualizações recentes do Windows 11, a Microsoft ativou por padrão 'Usar a tecla Print Screen para abrir a Ferramenta de Captura'. Isso intercepta a tecla PrintScreen antes que qualquer ferramenta da área de trabalho possa tratá-la. Desativar essa opção restaura o funcionamento normal da tecla PrintScreen.
