thanks=Obrigado por instalar o Greenshot! Já está em execução e espera por si na área de notificação, junto ao relógio.
tip1=Durante a captura, prima Espaço para alternar entre seleccionar uma região e capturar uma janela.
tip2=Durante a captura, as setas movem o cursor um píxel de cada vez, com Ctrl dez píxeis.
tip3=Prima Z durante a captura para mostrar ou ocultar a lupa, para selecções ao píxel.
tip4=Prima M durante a captura para mostrar ou ocultar o cursor do rato na captura de ecrã.
tip5=Prima F1 durante a captura para ver todas as teclas que pode usar.
tip6=Mudou de ideias? Esc cancela uma captura.
tip7=O editor pode pixelizar ou desfocar as partes de uma captura de ecrã que mais ninguém deve ver.
tip8=Numere os passos de um tutorial com o contador do editor.
tip9=Nas definições escolhe a pasta e o padrão do nome de ficheiro das capturas guardadas.
tip10=O Greenshot é gratuito e de código aberto, feito por voluntários. Se lhe é útil, fale dele aos seus amigos.
