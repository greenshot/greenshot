hotkeys_snipping_title=Apropriação pela Ferramenta de Recorte do Windows 10 / 11
hotkeys_snipping_disable_btn=🚫 Desactivar a apropriação pela Ferramenta de Recorte
hotkeys_snipping_settings_btn=⚙️ Abrir as definições de teclado do Windows
hotkeys_snipping_desc=Nas actualizações recentes do Windows 11, a Microsoft activou por predefinição 'Utilizar a tecla Print Screen para abrir a Ferramenta de Recorte'. Isto intercepta a tecla PrintScreen antes de qualquer ferramenta do ambiente de trabalho a poder tratar. Desactivá-la restaura o funcionamento normal da tecla PrintScreen.
hotkeys_snipping_status_disabled=A apropriação da tecla PrintScreen pela Ferramenta de Recorte do Windows está desactivada (ok).
hotkeys_snipping_status_enabled=A apropriação da tecla PrintScreen pela Ferramenta de Recorte do Windows está ACTIVADA de momento!
hotkeys_snipping_status_na=A apropriação pela Ferramenta de Recorte do Windows não se aplica a esta versão do Windows.
hotkeys_snipping_success=A apropriação da tecla PrintScreen pela Ferramenta de Recorte do Windows foi desactivada com êxito no Registo do Windows.
hotkeys_dropbox_title=Partilha de capturas de ecrã do Dropbox
hotkeys_dropbox_desc=O Dropbox tem a funcionalidade 'Partilhar capturas de ecrã com o Dropbox' em Preferências do Dropbox > Cópias de segurança. Quando activada, o Dropbox reclama PrintScreen e Alt+PrintScreen no arranque do sistema. Se as suas teclas de atalho não responderem, abra as Preferências do Dropbox, vá a Cópias de segurança e desmarque 'Partilhar capturas de ecrã com o Dropbox'.
