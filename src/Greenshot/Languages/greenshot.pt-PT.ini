hotkeys_onedrive_disable_btn=🚫 Desactivar a intercepção de capturas de ecrã pelo OneDrive
hotkeys_onedrive_desc=O OneDrive tem a definição 'Guardar automaticamente no OneDrive as capturas de ecrã que eu fizer'. Quando activada, o OneDrive regista a tecla PrintScreen antes do Greenshot. O botão acima actualiza o ficheiro de definições e o registo do OneDrive para desactivar este comportamento.
hotkeys_onedrive_status_disabled=A intercepção de capturas de ecrã pelo OneDrive está desactivada (ok).
hotkeys_onedrive_status_enabled=A captura de ecrã do OneDrive está ACTIVADA de momento e pode interceptar a tecla PrintScreen!
