tip3=Tveršanas laikā nospied Z, lai rādītu vai slēptu palielinātāju precīzai atlasei līdz pikselim.
tip4=Tveršanas laikā nospied M, lai rādītu vai slēptu peles kursoru ekrānattēlā.
tip5=Tveršanas laikā nospied F1, lai redzētu visus izmantojamos taustiņus.
tip6=Pārdomāji? Esc atceļ tveršanu.
tip7=Redaktors var sadrumstalot vai izpludināt ekrānattēla daļas, kuras neviens cits nedrīkst redzēt.
tip8=Numurē pamācības soļus ar redaktora skaitītāju.
tip9=Iestatījumos Tu izvēlies saglabāto ekrānattēlu mapi un faila vārda paraugu.
tip10=„Greenshot” ir bezmaksas un atvērtā pirmkoda programma, ko veido brīvprātīgie. Ja tā Tev palīdz, pastāsti par to saviem draugiem.
