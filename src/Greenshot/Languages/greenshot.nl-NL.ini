thanks=Bedankt voor het installeren van Greenshot! Het draait nu en wacht op u in het systeemvak, naast de klok.
tip1=Druk tijdens een schermopname op Spatie om te wisselen tussen een gebied selecteren en een venster opnemen.
tip2=Tijdens een schermopname verplaatsen de pijltoetsen de cursor telkens één pixel, met Ctrl tien pixels.
tip3=Druk tijdens een schermopname op Z om het vergrootglas te tonen of te verbergen, voor selecties tot op de pixel.
tip4=Druk tijdens een schermopname op M om de muisaanwijzer in de schermopname te tonen of te verbergen.
tip5=Druk tijdens een schermopname op F1 om alle toetsen te zien die u kunt gebruiken.
tip6=Bedacht? Esc annuleert een schermopname.
tip7=De beeldbewerker kan de delen van een schermopname die niemand anders mag zien pixeleren of vervagen.
tip8=Nummer de stappen van een handleiding met de teller van de beeldbewerker.
tip9=In de instellingen kiest u de map en het bestandsnaampatroon van opgeslagen schermopnamen.
tip10=Greenshot is gratis en open source, gemaakt door vrijwilligers. Als het u helpt, vertel het dan aan uw vrienden.
