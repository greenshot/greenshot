setup_tray_ok=Greenshot アイコンは時計の横に表示されています。
setup_version_checking=Greenshot は新しいバージョンを確認しています…
setup_version_download=ダウンロードする
setup_version_ok=最新バージョンの Greenshot {0} を使用しています。
setup_version_old=Greenshot {0} が利用可能です。現在のバージョンは {1} です。
setup_version_unknown=Greenshot は現在、新しいバージョンを確認できませんでした。
thanks=Greenshot をインストールしていただきありがとうございます! Greenshot は現在実行中で、時計の横の通知領域で待機しています。
tip1=キャプチャ中に Space を押すと、範囲の選択とウィンドウのキャプチャを切り替えられます。
tip2=キャプチャ中は、矢印キーでカーソルを 1 ピクセルずつ、Ctrl と一緒に押すと 10 ピクセルずつ移動できます。
tip3=キャプチャ中に Z を押すと拡大鏡の表示/非表示を切り替えられ、ピクセル単位で選択できます。
tip4=キャプチャ中に M を押すと、スクリーンショット内のマウス カーソルの表示/非表示を切り替えられます。
tip5=キャプチャ中に F1 を押すと、使用できるすべてのキーを確認できます。
tip6=気が変わりましたか? Esc でキャプチャをキャンセルできます。
tip7=エディターでは、他の人に見られたくないスクリーンショットの部分をモザイクやぼかしで隠せます。
tip8=エディターのカウンターを使って、手順書のステップに番号を付けられます。
tip9=設定では、保存するスクリーンショットのフォルダーとファイル名のパターンを選択できます。
tip10=Greenshot はボランティアによって作られた無料のオープン ソース ソフトウェアです。役に立ったら、友人にも紹介してください。
tip_next=別のヒント
tip_notification=Greenshot の通知をクリックして閉じてしまいましたか? 通知は Windows の通知センターに残っています。クリックすると、Greenshot を終了した後でも、キャプチャの出力先をもう一度選択できます。
tip_title=ご存知ですか?
title=Greenshot へようこそ
step_of=ステップ {0}/{1}