about_license=Copyright © 2007-2026 Thomas Braun, Jens Klingen, Robin Krom\nΔεν παρέχεται ΚΑΜΙΑ ΕΓΓΥΗΣΗ για το Greenshot. Είναι ελεύθερο λογισμικό. Είστε ελεύθεροι να το αναδιανείμετε κάτω από ορισμένες συνθήκες.\nΛεπτομέρειες σχετικά με την GNU General Public License:
about_title=Πληροφορίες για το Greenshot
