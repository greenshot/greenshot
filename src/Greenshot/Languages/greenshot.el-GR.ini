bugreport_intro=Το Greenshot αντιμετώπισε ένα σφάλμα, αλλά μην ανησυχείτε, η εργασία σας είναι ασφαλής. Μπορείτε να ελέγξετε αν το πρόβλημα έχει ήδη αναφερθεί ή να υποβάλετε μια νέα αναφορά σφάλματος με τις παρακάτω λεπτομέρειες.
