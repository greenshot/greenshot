hotkeys_snipping_desc=Στις σύγχρονες ενημερώσεις των Windows 11, η Microsoft ενεργοποίησε από προεπιλογή τη ρύθμιση 'Χρήση του πλήκτρου Print Screen για άνοιγμα του Εργαλείου αποκομμάτων'. Αυτό υποκλέπτει το PrintScreen πριν μπορέσει να το χειριστεί οποιοδήποτε εργαλείο επιφάνειας εργασίας. Η απενεργοποίησή της επαναφέρει την κανονική λειτουργία του PrintScreen.
