setup_snipping_fix=Παραχώρηση του πλήκτρου Print στο Greenshot
setup_sub=Τι χρειάζεται το Greenshot για να λειτουργεί όπως αναμένεται, με διόρθωση όπου κάτι δεν πάει καλά
setup_title=Η εγκατάστασή σας
setup_tray_fix=Εμφάνιση δίπλα στο ρολόι
setup_tray_hidden=Τα Windows κρύβουν το εικονίδιο του Greenshot πίσω από το βέλος (^) δίπλα στο ρολόι. Το Greenshot μπορεί να το εμφανίσει δίπλα στο ρολόι για εσάς, ή μπορείτε να το ενεργοποιήσετε μόνοι σας στο "Άλλα εικονίδια περιοχής ειδοποιήσεων" στις ρυθμίσεις της γραμμής εργασιών.
setup_tray_ok=Το εικονίδιο του Greenshot εμφανίζεται δίπλα στο ρολόι.
setup_version_checking=Το Greenshot ελέγχει για νεότερη έκδοση…
setup_version_download=Λήψη
setup_version_ok=Έχετε την τελευταία έκδοση του Greenshot, {0}.
setup_version_old=Το Greenshot {0} είναι διαθέσιμο, έχετε το {1}.
setup_version_unknown=Το Greenshot δεν μπόρεσε να ελέγξει για νεότερη έκδοση αυτή τη στιγμή.
thanks=Σας ευχαριστούμε που εγκαταστήσατε το Greenshot! Εκτελείται τώρα και σας περιμένει στην περιοχή ειδοποιήσεων, δίπλα στο ρολόι.
tip1=Κατά την καταγραφή, πατήστε Space για εναλλαγή μεταξύ επιλογής περιοχής και καταγραφής παραθύρου.
tip2=Κατά την καταγραφή, τα βελάκια μετακινούν τον δείκτη ένα εικονοστοιχείο τη φορά, με το Ctrl δέκα εικονοστοιχεία.
tip3=Πατήστε Z κατά την καταγραφή για εμφάνιση ή απόκρυψη του μεγεθυντή, για επιλογές με ακρίβεια εικονοστοιχείου.
tip4=Πατήστε M κατά την καταγραφή για εμφάνιση ή απόκρυψη του δείκτη του ποντικιού στο στιγμιότυπο.
tip5=Πατήστε F1 κατά την καταγραφή για να δείτε όλα τα πλήκτρα που μπορείτε να χρησιμοποιήσετε.
tip6=Αλλάξατε γνώμη; Το Esc ακυρώνει μια καταγραφή.
tip7=Ο επεξεργαστής μπορεί να εφαρμόσει pixelation ή θόλωμα στα μέρη ενός στιγμιότυπου που δεν πρέπει να δει κανείς άλλος.
tip8=Αριθμήστε τα βήματα ενός οδηγού με τον αριθμητή του επεξεργαστή.
tip9=Στις ρυθμίσεις επιλέγετε τον φάκελο και το πρότυπο ονόματος αρχείου των αποθηκευμένων στιγμιότυπων.
tip10=Το Greenshot είναι δωρεάν και ανοιχτού κώδικα, φτιαγμένο από εθελοντές. Αν σας βοηθά, πείτε το στους φίλους σας.
tip_next=Άλλη συμβουλή
tip_notification=Κλείσατε κατά λάθος μια ειδοποίηση του Greenshot; Σας περιμένει στο κέντρο ειδοποιήσεων των Windows: με ένα κλικ πάνω της μπορείτε να επιλέξετε ξανά πού πηγαίνει η καταγραφή, ακόμη και αφού κλείσει το Greenshot.
tip_title=Το ξέρατε;
