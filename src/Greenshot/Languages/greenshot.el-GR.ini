done=Αυτά χρειάζεστε για να ξεκινήσετε. Το Greenshot περιμένει δίπλα στο ρολόι και όλα τα υπόλοιπα μπορούν να αλλάξουν στις ρυθμίσεις όποτε θέλετε.
done_title=Είστε έτοιμοι
intro=Σε λίγα βήματα θα δείτε πώς λειτουργεί η καταγραφή, και το Greenshot ελέγχει ότι όλα έχουν ρυθμιστεί σωστά.
setup_onedrive=Το OneDrive δεσμεύει το πλήκτρο Print για να αποθηκεύει το ίδιο στιγμιότυπα.
