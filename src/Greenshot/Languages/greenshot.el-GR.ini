message_filenamepattern=Τα ακόλουθα σύμβολα κράτησης θέσης θα αντικατασταθούν αυτόματα στο προκαθορισμένο πρότυπο:\n${YYYY} έτη, 4 ψηφία\n${MM} μήνες, 2 ψηφία\n${DD} ημέρες, 2 ψηφία\n${hh} ώρες, 2 ψηφία\n${mm} λεπτά, 2 ψηφία\n${ss} δευτερόλεπτα, 2 ψηφία\n${NUM} αυξανόμενος αριθμός, 6 ψηφία\n${title} Τίτλος Παραθύρου\n${user} Χρήστης Windows\n${domain} Κυριότητα Windows\n${hostname} Όνομα Υπολογιστή\n\nΜπορείτε επίσης να δημιουργήσετε με το Greenshot καταλόγους δυναμικά, χρησιμοποιώντας το σύμβολο backslash, ανάποδη κάθετο (\\) για το διαχωρισμό του ονόματος φακέλων και του ονόματος των αρχείων.\nΠαράδειγμα: το πρότυπο ${YYYY}-${MM}-${DD}\\${hh}-${mm}-${ss}\nθα δημιουργήσει ένα φάκελο, με όνομα την τρέχουσα ημέρα, στην προεπιλεγμένη θέση αποθήκευσης, π.χ. 2013-03-13, το δε όνομα του αρχείου θα βασίζεται στην τρέχουσα ώρα, π.χ. 11_58_32 (συν την επέκταση που έχει καθοριστεί στις ρυθμίσεις)
