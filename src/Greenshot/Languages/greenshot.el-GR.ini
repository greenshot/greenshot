approval_ai_title_change=Ένα εργαλείο AI θέλει να αλλάξει μια συνταγή
approval_ai_title_new=Ένα εργαλείο AI προτείνει μια συνταγή
approval_ai_description=Αυτή η συνταγή γράφτηκε από ένα εργαλείο AI, όχι από το Greenshot ή από εσάς. Ελέγξτε παρακάτω τι κάνει (το Greenshot την περιγράφει από την ίδια τη συνταγή) και ενεργοποιήστε μόνο τα εναύσματα που θέλετε.
