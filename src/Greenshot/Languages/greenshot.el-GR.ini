approval_ai_request=Τι λέει το εργαλείο AI ότι ζητήσατε (τα λόγια του AI):
approval_ai_explanation=Η εξήγηση του εργαλείου AI (τα λόγια του AI):
approval_ai_check=Μόνο το "Τι κάνει" παρακάτω προέρχεται από το ίδιο το Greenshot, συγκρίνετέ το με αυτό που ζητήσατε.
approval_own_subtitle=Εγκρίνετε τις αλλαγές σας
approval_own_title=Η αλλαγή σας χρειάζεται απόφαση
approval_own_description=Αποθηκεύσατε αυτή τη συνταγή στον επεξεργαστή συνταγών. Οι περισσότερες αλλαγές εγκρίνονται χωρίς ερώτηση, αλλά αυτή προσθέτει κάτι που χρειάζεται την απόφασή σας: {0}
approval_modified_subtitle=Εντοπίστηκε τροποποίηση συνταγής
approval_modified_title=Η συνταγή άλλαξε εκτός Greenshot
approval_modified_description=Είχατε εγκρίνει αυτή τη συνταγή καταγραφής στο παρελθόν, αλλά το αρχείο της άλλαξε από τότε εκτός Greenshot (από άλλο πρόγραμμα ή με το χέρι). Ελέγξτε τις αλλαγές παρακάτω πριν τις εγκρίνετε.
approval_modified_alert=Το περιεχόμενο του αρχείου τροποποιήθηκε στον δίσκο
approval_modified_alert_text=Αυτή η συνταγή είχε εγκριθεί στο παρελθόν, αλλά το περιεχόμενο του αρχείου της στον δίσκο έχει αλλάξει από την τελευταία έγκριση. Επαληθεύστε τις αλλαγές παρακάτω πριν εγκρίνετε ξανά την εκτέλεση:
approval_previously_approved=Εγκρίθηκε στο παρελθόν:
approval_previous_sha=Προηγούμενο SHA-256:
approval_new_sha=Νέο SHA-256:
approval_review_subtitle=Έλεγχος ασφαλείας συνταγής
approval_review_title=Έλεγχος συνταγής καταγραφής
approval_review_description=Αλλάξτε ποια εναύσματα μπορούν να ξεκινούν αυτή τη συνταγή και τι μπορεί να κάνει. Το "Διατήρηση ως έχει" ή το κλείσιμο του παραθύρου δεν αλλάζει τίποτα.
approval_new_subtitle=Έγκριση ασφαλείας συνταγής
approval_new_title=Εντοπίστηκε εξωτερική συνταγή καταγραφής
approval_new_description=Ένα νέο αρχείο συνταγής καταγραφής ζητά να καταχωριστεί στο Greenshot. Ελέγξτε τις λεπτομέρειες, τα εναύσματα και τα βήματα εκτέλεσής του πριν το εγκρίνετε.
approval_details_title=Λεπτομέρειες συνταγής
approval_details_builtin_description=Τι κάνει αυτή η ενσωματωμένη συνταγή και ποια εναύσματα την ξεκινούν.
approval_details_description=Τι κάνει αυτή η συνταγή και τι έχετε εγκρίνει γι' αυτήν. Εδώ δεν μπορεί να αλλάξει τίποτα, χρησιμοποιήστε γι' αυτό τον Έλεγχο στις ρυθμίσεις ή τα Δικαιώματα στη διαχείριση συνταγών.
approval_ext_validation_failed=Η επικύρωση του αυτόματου βήματος απέτυχε
approval_ext_validation_description=Το Greenshot δεν μπόρεσε να χρησιμοποιήσει αυτό το αυτόματο βήμα επειδή περιέχει σφάλματα. Ελέγξτε τις λεπτομέρειες παρακάτω:
approval_ext_details_title=Λεπτομέρειες αυτόματου βήματος
approval_ext_details_description=Τι κάνει αυτό το αυτόματο βήμα, ποιες συνταγές αλλάζει και τι έχετε εγκρίνει γι' αυτό.
approval_ext_ai_subtitle=Αυτόματο βήμα που προτάθηκε από εργαλείο AI
approval_ext_ai_title=Ένα εργαλείο AI προτείνει ένα αυτόματο βήμα
approval_ext_ai_description=Αυτό το αυτόματο βήμα γράφτηκε από ένα εργαλείο AI. Αλλάζει άλλες συνταγές, μαζί και τις ενσωματωμένες: ελέγξτε παρακάτω ποιες και τι προσθέτει. Ξεκινά απενεργοποιημένο, ενεργοποιήστε το στις Ρυθμίσεις > Συνταγές.
approval_ext_modified_subtitle=Εντοπίστηκε τροποποίηση αυτόματου βήματος
approval_ext_modified_title=Το αυτόματο βήμα άλλαξε εκτός Greenshot
approval_ext_modified_description=Είχατε εγκρίνει αυτό το αυτόματο βήμα στο παρελθόν, αλλά το αρχείο του άλλαξε από τότε εκτός Greenshot. Μέχρι να εγκρίνετε τις αλλαγές, δεν αλλάζει καμία συνταγή.
