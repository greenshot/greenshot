approval_validation_description=Το Greenshot δεν μπόρεσε να φορτώσει ή να καταχωρίσει αυτή τη συνταγή καταγραφής επειδή περιέχει σφάλματα διαμόρφωσης. Ελέγξτε τις διαγνωστικές λεπτομέρειες παρακάτω:
approval_validation_info=Αυτή η συνταγή δεν μπόρεσε να καταχωριστεί ή να φορτωθεί λόγω σφαλμάτων διαμόρφωσης. Ελέγξτε τα προβλήματα και τις διαγνωστικές υποδείξεις παρακάτω:
