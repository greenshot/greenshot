aitools_enabled_description=Τα εργαλεία AI (όπως το Claude Desktop ή το VS Code) συνδέονται μέσω του greenshot-mcp.exe, μιας ξεχωριστής λήψης που πρέπει να βρίσκεται δίπλα στο Greenshot.exe. Μπορούν να εμφανίζουν τη λίστα των παραθύρων σας, να λαμβάνουν στιγμιότυπα και να εκτελούν τις συνταγές σας. Όσο αυτό είναι ανενεργό, το Greenshot απορρίπτει κάθε αίτημα χωρίς ερώτηση. Κάθε πρόγραμμα χρειάζεται πάντα την άδειά σας την πρώτη φορά που συνδέεται.
