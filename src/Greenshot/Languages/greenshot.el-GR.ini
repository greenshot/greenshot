[Welcome]
basics_after=Τι γίνεται με μια καταγραφή το αποφασίζετε εσείς: άνοιγμα στον επεξεργαστή, αποθήκευση, αντιγραφή στο πρόχειρο, εκτύπωση και άλλα. Επιλέγετε στις ρυθμίσεις.
