hotkeys_dropbox_desc=Dropbox har funktionen 'Dela skärmbilder med Dropbox' under Dropbox-inställningar > Säkerhetskopior. När den är aktiverad tar Dropbox PrintScreen och Alt+PrintScreen vid systemstart. Om dina kortkommandon inte svarar, öppna Dropbox-inställningar, gå till Säkerhetskopior och avmarkera 'Dela skärmbilder med Dropbox'.
