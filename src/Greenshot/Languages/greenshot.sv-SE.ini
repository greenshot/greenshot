thanks=Tack för att du installerade Greenshot! Det körs nu och väntar på dig i meddelandefältet, bredvid klockan.
tip1=När du tar en skärmdump växlar Blanksteg mellan att markera en yta och att ta skärmdump av ett fönster.
tip2=När du tar en skärmdump flyttar piltangenterna markören en pixel i taget, med Ctrl tio pixlar.
tip3=Tryck på Z när du tar en skärmdump för att visa eller dölja förstoringen, för pixelexakta markeringar.
tip4=Tryck på M när du tar en skärmdump för att visa eller dölja muspekaren i skärmdumpen.
tip5=Tryck på F1 när du tar en skärmdump för att se alla tangenter du kan använda.
tip6=Ändrat dig? Esc avbryter en skärmdump.
tip7=Redigeraren kan pixelera eller göra oskarpt de delar av en skärmdump som ingen annan ska se.
tip8=Numrera stegen i en instruktion med redigerarens räknare.
tip9=I inställningarna väljer du mappen och filnamnsmönstret för sparade skärmdumpar.
tip10=Greenshot är gratis och har öppen källkod, gjort av frivilliga. Om det hjälper dig, berätta för dina vänner om det.
