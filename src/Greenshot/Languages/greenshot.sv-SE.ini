bugreport_info=Ojsan, ett oväntat fel uppstod.\n\nDen goda nyheten är att du kan hjälpa oss lösa problemet genom att rapportera det till oss.\nVar vänlig besök länken nedan, och skapa en ny felrapport (bug report). Klistra in felmeddelandets innehåll i beskrivningen.\n\nLägg till en meningsfull sammanfattning och ta med information du tror kan vara till hjälp för att kunna återskapa felet.\nInnan du skickar uppskattar vi verkligen om du kontrollerar om felet redan blivit rapporterat. (Använd sökfunktionen för att snabbt hitta dem.) Tack! :)
