hotkeys_onedrive_desc=OneDrive tiene la opción 'Guardar automáticamente en OneDrive las capturas de pantalla que hago'. Si está activada, OneDrive registra ImprPant antes que Greenshot. El botón de arriba actualiza el archivo de configuración de OneDrive y el registro para desactivar este comportamiento.
