hotkeys_snipping_title=Toma de control por Recortes de Windows 10 / 11
hotkeys_snipping_disable_btn=🚫 Desactivar la toma de control de Recortes
hotkeys_snipping_settings_btn=⚙️ Abrir la configuración de teclado de Windows
hotkeys_snipping_desc=En las actualizaciones recientes de Windows 11, Microsoft activó por defecto 'Usar la tecla ImprPant pantalla para abrir Recortes'. Esto intercepta ImprPant antes de que cualquier herramienta de escritorio pueda gestionarla. Desactivarlo restaura el funcionamiento normal de ImprPant.
