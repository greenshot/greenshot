hotkeys_dropbox_title=Compartir capturas de pantalla de Dropbox
hotkeys_dropbox_desc=Dropbox tiene una función 'Compartir capturas de pantalla con Dropbox' en Preferencias de Dropbox > Copias de seguridad. Si está activada, Dropbox reclama ImprPant y Alt+ImprPant al iniciarse el sistema. Si tus teclas rápidas no responden, abre las Preferencias de Dropbox, ve a Copias de seguridad y desmarca 'Compartir capturas de pantalla con Dropbox'.
