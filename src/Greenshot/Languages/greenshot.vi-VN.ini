setup_tray_hidden=Windows ẩn biểu tượng Greenshot sau mũi tên (^) cạnh đồng hồ. Greenshot có thể hiện nó cạnh đồng hồ cho bạn, hoặc bạn có thể tự bật trong "Các biểu tượng khay hệ thống khác" ở thiết lập thanh tác vụ.
setup_tray_ok=Biểu tượng Greenshot được hiển thị cạnh đồng hồ.
