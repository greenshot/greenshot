setup_version_unknown=Hiện Greenshot không thể kiểm tra phiên bản mới hơn.
thanks=Cảm ơn bạn đã cài đặt Greenshot! Chương trình đang chạy và chờ bạn trong vùng thông báo, cạnh đồng hồ.
tip1=Khi đang chụp, nhấn Space để chuyển giữa chọn vùng và chụp cửa sổ.
tip2=Khi đang chụp, các phím mũi tên di chuyển con trỏ từng điểm ảnh một, kèm Ctrl thì mười điểm ảnh.
tip3=Nhấn Z khi đang chụp để hiện hoặc ẩn kính lúp, giúp chọn chính xác đến từng điểm ảnh.
tip4=Nhấn M khi đang chụp để hiện hoặc ẩn con trỏ chuột trong ảnh chụp màn hình.
tip5=Nhấn F1 khi đang chụp để xem tất cả các phím bạn có thể dùng.
tip6=Đổi ý rồi? Esc sẽ hủy việc chụp.
tip7=Trình soạn thảo có thể làm mờ hoặc tạo mosaic cho những phần của ảnh chụp mà người khác không nên thấy.
tip8=Đánh số các bước trong một bài hướng dẫn bằng bộ đếm của trình soạn thảo.
tip9=Trong thiết lập, bạn chọn thư mục và mẫu tên tệp của ảnh chụp màn hình được lưu.
tip10=Greenshot miễn phí và mã nguồn mở, do các tình nguyện viên làm ra. Nếu nó giúp ích cho bạn, hãy giới thiệu cho bạn bè.
tip_next=Mẹo khác
tip_notification=Lỡ tắt một thông báo của Greenshot? Nó vẫn chờ trong trung tâm thông báo của Windows: nhấp vào đó để chọn lại nơi gửi ảnh chụp, kể cả sau khi Greenshot đã đóng.
tip_title=Bạn có biết?
