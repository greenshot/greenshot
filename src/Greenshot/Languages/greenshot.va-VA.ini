message_filenamepattern=Els següents placeholders se reemplaçaran automàticament en el patró definit:\n${YYYY} any, 4 dígits\n${MM} mes, 2 dígits\n${DD} dia, 2 dígits\n${hh} hora, 2 dígits\n${mm} minut, 2 dígits\n${ss} segon, 2 dígits\n${NUM} número incrementatiu, 6 dígits\n${RRR...} caràcters alfanumèrics aleatoris, mateixa llargària que les “R”\n${title} Títul de la finestra\n${user} Usuari de Windows\n${domain} Domini de Windows\n${hostname} Nom del PC\n\nTambé pot fer que Greenshot cree directoris dinàmicament; simplement use la barra invertida (\\) per a separar carpetes i nom d'archiu.\nEixemple: el patró ${YYYY}-${MM}-${DD}\\${hh}-${mm}-${ss}\ngenerarà una carpeta per al dia actual en la seua ubicació de guardat predeterminada, p. ex. 2008-06-29; el nom de l'archiu de la captura contenguda es basarà en l'hora actual,\np. ex. 11_58_32 (més l'extensió definida en la configuració).
