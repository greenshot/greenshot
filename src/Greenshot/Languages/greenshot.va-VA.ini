bugreport_info=Ho sentim, s'ha produït un error inesperat.\n\nLa bona notícia és que pot ajudar-nos a eliminar-lo enviant un informe d'error.\nPer favor, visite l'URL de davall, cree un nou informe i apegue el contingut de l'àrea de text en la descripció.\n\nPer favor, afegixca un resum clar i aporte qualsevol informació que considere útil per a reproduir el problema.\nTambé li agrairíem molt que comprovara si ya existix un element en el rastrejador per a este erro. (Pot usar la busca per a trobar-los ràpidament.) Gràcies :)
