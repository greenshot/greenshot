intro=몇 단계만에 캡처 방법을 알아보고, Greenshot이 모든 것이 잘 설정되었는지 확인합니다.
setup_onedrive=OneDrive가 스크린샷을 직접 저장하려고 Print 키를 사용합니다.
setup_onedrive_fix=Print 키를 Greenshot에 맡기기
setup_print_ok=Print 키로 Greenshot 캡처가 시작됩니다.
setup_snipping=Print 키를 누르면 Greenshot 대신 Windows 캡처 도구가 열립니다.
setup_snipping_fix=Print 키를 Greenshot에 맡기기
setup_sub=Greenshot이 예상대로 작동하는 데 필요한 것과, 문제가 있을 때의 해결 방법
setup_title=내 설정
setup_tray_fix=시계 옆에 표시
setup_tray_hidden=Windows가 Greenshot 아이콘을 시계 옆 화살표(^) 뒤에 숨기고 있습니다. Greenshot이 시계 옆에 표시하도록 할 수 있고, 작업 표시줄 설정의 "기타 시스템 트레이 아이콘"에서 직접 켤 수도 있습니다.
setup_tray_ok=Greenshot 아이콘이 시계 옆에 표시되어 있습니다.
setup_version_checking=Greenshot이 새 버전을 확인하는 중…
setup_version_download=다운로드
setup_version_ok=최신 버전의 Greenshot {0}을(를) 사용 중입니다.
setup_version_old=Greenshot {0}을(를) 이용할 수 있습니다. 현재 버전은 {1}입니다.
setup_version_unknown=Greenshot이 지금은 새 버전을 확인할 수 없습니다.
thanks=Greenshot을 설치해 주셔서 감사합니다! 지금 실행 중이며 시계 옆 알림 영역에서 대기하고 있습니다.
tip1=캡처 중 Space를 누르면 구역 선택과 작업창 캡처를 전환합니다.
tip2=캡처 중 화살표 키는 커서를 1픽셀씩, Ctrl과 함께 누르면 10픽셀씩 이동합니다.
tip3=캡처 중 Z를 누르면 돋보기를 표시하거나 숨겨 픽셀 단위로 선택할 수 있습니다.
tip4=캡처 중 M을 누르면 스크린샷에서 마우스 커서를 표시하거나 숨깁니다.
tip5=캡처 중 F1을 누르면 사용할 수 있는 모든 키를 볼 수 있습니다.
tip6=마음이 바뀌었나요? Esc로 캡처를 취소합니다.
tip7=편집기로 다른 사람이 보면 안 되는 스크린샷 부분을 모자이크하거나 흐리게 할 수 있습니다.
tip8=편집기의 카운터로 사용 방법의 단계에 번호를 매기세요.
tip9=설정에서 저장할 스크린샷의 폴더와 파일명 유형을 선택합니다.
tip10=Greenshot은 자원봉사자들이 만든 무료 오픈 소스입니다. 도움이 된다면 친구들에게 알려 주세요.
tip_next=다른 팁
tip_notification=Greenshot 알림을 클릭해 닫으셨나요? 알림은 Windows 알림 센터에 남아 있습니다. 클릭하면 Greenshot을 종료한 후에도 캡처를 보낼 곳을 다시 선택할 수 있습니다.
tip_title=알고 계셨나요?
