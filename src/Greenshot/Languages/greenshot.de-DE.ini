[Welcome]
basics_after=Was mit einer Aufnahme passiert, entscheiden Sie: im Editor öffnen, speichern, in die Zwischenablage kopieren, drucken und mehr. Sie wählen das in den Einstellungen.
basics_fullscreen=Kompletten Bildschirm abfotografieren
basics_lastregion=Denselben Bereich erneut abfotografieren
basics_menu=Alles finden Sie auch im Menü des Greenshot-Symbols neben der Uhr.
basics_region=Bereich oder Fenster auswählen
basics_title=Zum Abfotografieren genügt eine Taste
basics_window=Aktives Fenster abfotografieren
button_back=Zurück
button_next=Weiter
button_settings=Einstellungen öffnen
button_start=Los geht's!
done=Das ist alles, was Sie zum Start brauchen. Greenshot wartet neben der Uhr, und alles andere lässt sich jederzeit in den Einstellungen ändern.
done_title=Alles bereit
intro=In wenigen Schritten sehen Sie, wie das Abfotografieren funktioniert, und Greenshot prüft, ob alles gut eingerichtet ist.
setup_onedrive=OneDrive belegt die Druck-Taste, um selbst Screenshots zu speichern.
setup_onedrive_fix=Druck-Taste Greenshot überlassen
setup_print_ok=Die Druck-Taste startet eine Aufnahme mit Greenshot.
setup_snipping=Die Druck-Taste öffnet das Windows Snipping Tool statt Greenshot.
setup_snipping_fix=Druck-Taste Greenshot überlassen
setup_sub=Was Greenshot braucht, um wie erwartet zu funktionieren, mit einer Lösung, wo etwas nicht stimmt
setup_title=Ihre Einrichtung
setup_tray_fix=Neben der Uhr anzeigen
setup_tray_hidden=Windows versteckt das Greenshot-Symbol hinter dem Pfeil (^) neben der Uhr. Greenshot kann es für Sie neben der Uhr anzeigen, oder Sie schalten es selbst unter "Weitere Symbole im Infobereich" in den Taskleisten-Einstellungen ein.
setup_tray_ok=Das Greenshot-Symbol wird neben der Uhr angezeigt.
setup_version_checking=Greenshot sucht nach einer neueren Version…
setup_version_download=Herunterladen
setup_version_ok=Sie haben die neueste Version von Greenshot, {0}.
setup_version_old=Greenshot {0} ist verfügbar, Sie haben {1}.
setup_version_unknown=Greenshot konnte gerade nicht nach einer neueren Version suchen.
thanks=Danke, dass Sie Greenshot installiert haben! Es läuft jetzt und wartet im Infobereich neben der Uhr auf Sie.
tip1=Drücken Sie beim Abfotografieren die Leertaste, um zwischen Bereichsauswahl und Fensteraufnahme zu wechseln.
tip2=Beim Abfotografieren bewegen die Pfeiltasten den Cursor um jeweils ein Pixel, mit Strg um zehn Pixel.
tip3=Drücken Sie beim Abfotografieren Z, um die Lupe für pixelgenaue Auswahlen ein- oder auszublenden.
tip4=Drücken Sie beim Abfotografieren M, um den Mauszeiger im Screenshot ein- oder auszublenden.
tip5=Drücken Sie beim Abfotografieren F1, um alle verwendbaren Tasten zu sehen.
tip6=Doch anders entschieden? Esc bricht eine Aufnahme ab.
tip7=Der Editor kann die Teile eines Screenshots verpixeln oder weichzeichnen, die sonst niemand sehen soll.
tip8=Nummerieren Sie die Schritte einer Anleitung mit dem Zähler des Editors.
tip9=In den Einstellungen wählen Sie den Ordner und das Dateinamensmuster gespeicherter Screenshots.
tip10=Greenshot ist kostenlos und Open Source, gemacht von Freiwilligen. Wenn es Ihnen hilft, erzählen Sie Ihren Freunden davon.
tip_next=Noch ein Tipp
tip_notification=Eine Benachrichtigung von Greenshot weggeklickt? Sie wartet im Windows-Benachrichtigungscenter: Ein Klick darauf lässt Sie erneut wählen, wohin die Aufnahme geht, auch nachdem Greenshot geschlossen wurde.
tip_title=Schon gewusst?
title=Willkommen bei Greenshot
