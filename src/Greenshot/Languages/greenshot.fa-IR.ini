basics_after=اینکه با یک نمونه چه اتفاقی بیفتد به شما بستگی دارد: آن را در ویرایشگر باز کنید، ذخیره کنید، در حافظه موقت کپی کنید، چاپ کنید و موارد دیگر. انتخاب آن در تنظیمات است.
