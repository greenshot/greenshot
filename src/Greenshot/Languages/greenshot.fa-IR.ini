setup_tray_hidden=Windows آیکن Greenshot را پشت پیکان (^) کنار ساعت پنهان می‌کند. Greenshot می‌تواند آن را برای شما کنار ساعت نمایش دهد، یا خودتان می‌توانید آن را در تنظیمات نوار وظیفه زیر "سایر آیکن‌های سینی سیستم" روشن کنید.
