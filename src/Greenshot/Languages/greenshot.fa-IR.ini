thanks=از اینکه Greenshot را نصب کردید سپاسگزاریم! اکنون در حال اجراست و در ناحیه اعلان‌ها، کنار ساعت، منتظر شماست.
tip1=هنگام نمونه‌برداری، Space را فشار دهید تا بین انتخاب ناحیه و نمونه‌برداری از پنجره جابجا شوید.
tip2=هنگام نمونه‌برداری، کلیدهای جهت‌نما مکان‌نما را هر بار یک پیکسل جابجا می‌کنند، و با Ctrl ده پیکسل.
tip3=هنگام نمونه‌برداری Z را فشار دهید تا ذره‌بین برای انتخاب دقیق تا حد پیکسل نمایش داده یا پنهان شود.
tip4=هنگام نمونه‌برداری M را فشار دهید تا نشانگر ماوس در نمونه نمایش داده یا پنهان شود.
tip5=هنگام نمونه‌برداری F1 را فشار دهید تا همه کلیدهای قابل استفاده را ببینید.
tip6=نظرتان عوض شد؟ Esc نمونه‌برداری را لغو می‌کند.
tip7=ویرایشگر می‌تواند بخش‌هایی از نمونه را که کس دیگری نباید ببیند شطرنجی یا محو کند.
tip8=مراحل یک راهنما را با شمارنده ویرایشگر شماره‌گذاری کنید.
tip9=در تنظیمات پوشه و الگوی نام فایل نمونه‌های ذخیره‌شده را انتخاب می‌کنید.
tip10=Greenshot رایگان و متن‌باز است و توسط داوطلبان ساخته شده است. اگر به شما کمک می‌کند، درباره آن به دوستانتان بگویید.
tip_next=نکته‌ای دیگر
tip_notification=اعلانی از Greenshot را بستید؟ در مرکز اعلان‌های Windows منتظر است: با کلیک روی آن می‌توانید دوباره انتخاب کنید که نمونه به کجا برود، حتی پس از بسته شدن Greenshot.
