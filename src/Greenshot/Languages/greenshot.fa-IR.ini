imgur_sub=Greenshot دیگر در Imgur بارگذاری نمی‌کند. برای تصاویری که با نسخه‌های قبلی Greenshot به صورت ناشناس بارگذاری کرده‌اید، هنوز کلیدهای حذف را دارد، بنابراین می‌تواند آن‌ها را برای شما حذف کند. فقط Greenshot می‌تواند این کار را انجام دهد، Imgur راه دیگری برای بارگذاری‌های ناشناس ندارد.
