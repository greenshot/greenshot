thanks=Dziękujemy za zainstalowanie Greenshota! Już działa i czeka na Ciebie w obszarze powiadomień, obok zegara.
tip1=Podczas przechwytywania naciśnij Spację, aby przełączać między zaznaczaniem obszaru a zrzutem okna.
tip2=Podczas przechwytywania strzałki przesuwają kursor o jeden piksel, z Ctrl o dziesięć pikseli.
tip3=Naciśnij Z podczas przechwytywania, aby pokazać lub ukryć lupę do zaznaczania z dokładnością do piksela.
tip4=Naciśnij M podczas przechwytywania, aby pokazać lub ukryć kursor myszy na zrzucie ekranu.
tip5=Naciśnij F1 podczas przechwytywania, aby zobaczyć wszystkie dostępne klawisze.
tip6=Zmiana planów? Esc anuluje zrzut.
tip7=Edytor potrafi spikselizować lub rozmyć te części zrzutu ekranu, których nikt inny nie powinien widzieć.
tip8=Ponumeruj kroki instrukcji za pomocą licznika w edytorze.
tip9=W ustawieniach wybierasz folder i szablon nazwy pliku zapisywanych zrzutów ekranu.
tip10=Greenshot jest darmowy i open source, tworzony przez wolontariuszy. Jeśli Ci pomaga, opowiedz o nim znajomym.
tip_next=Kolejna wskazówka
tip_notification=Zamknięto powiadomienie Greenshota? Czeka ono w centrum powiadomień Windows: kliknięcie go pozwala ponownie wybrać, dokąd trafi zrzut, nawet po zamknięciu Greenshota.
