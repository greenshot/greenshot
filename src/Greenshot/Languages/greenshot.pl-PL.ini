approval_triggers_off_hint=Wyzwalacze są początkowo wyłączone. Zaznacz każdy, który może uruchamiać ten przepis: wyzwalacz pozostawiony wyłączony pozostaje wyłączony (możesz go później włączyć opcją Uprawnienia w menedżerze przepisów). Bez wyzwalacza nadal możesz uruchomić przepis z listy przepisów.
