approval_revoke_question=Cofnąć zatwierdzenie „{0}”? Przepis od razu przestaje działać i nie jest ponownie wczytywany. Jego plik pozostaje na miejscu: otwórz go ponownie, aby go przejrzeć i zatwierdzić.
