approval_validation_failed=Walidacja przepisu nie powiodła się
approval_validation_description=Greenshot nie mógł wczytać ani zarejestrować tego przepisu przechwytywania, ponieważ zawiera on błędy konfiguracji. Przejrzyj poniższe szczegóły diagnostyczne:
approval_validation_info=Nie można było zarejestrować ani wczytać tego przepisu z powodu błędów konfiguracji. Przejrzyj poniższe problemy i wskazówki diagnostyczne:
approval_validation_unknown=Podczas wczytywania przepisu wystąpił nieznany błąd walidacji.
approval_hint=Zalecenie / Wskazówka:
approval_ai_subtitle=Przepis zaproponowany przez narzędzie AI
approval_ai_title_change=Narzędzie AI chce zmienić przepis
approval_ai_title_new=Narzędzie AI proponuje przepis
approval_ai_description=Ten przepis napisało narzędzie AI, a nie Greenshot ani Ty. Sprawdź poniżej, co robi (Greenshot opisuje to na podstawie samego przepisu), i włącz tylko te wyzwalacze, których chcesz.
approval_ai_written=Napisane przez narzędzie AI
approval_ai_request=O co według narzędzia AI prosisz (słowa AI):
approval_ai_explanation=Wyjaśnienie narzędzia AI (słowa AI):
approval_ai_check=Tylko „Co robi” poniżej pochodzi od samego Greenshota, porównaj to z tym, o co prosisz.
approval_own_subtitle=Zatwierdź swoje zmiany
approval_own_title=Twoja zmiana wymaga decyzji
approval_own_description=Ten przepis został zapisany w edytorze przepisów. Większość zmian jest zatwierdzana bez pytania, ale ta dodaje coś, co wymaga Twojej decyzji: {0}
approval_modified_subtitle=Wykryto modyfikację przepisu
approval_modified_title=Przepis zmieniony poza Greenshotem
approval_modified_description=Ten przepis przechwytywania był już wcześniej zatwierdzony, ale od tego czasu jego plik został zmieniony poza Greenshotem (przez inny program lub ręcznie). Przejrzyj poniższe zmiany przed ich zatwierdzeniem.
approval_modified_alert=Zawartość pliku na dysku została zmodyfikowana
approval_modified_alert_text=Ten przepis był wcześniej zatwierdzony, ale zawartość jego pliku na dysku zmieniła się od ostatniego zatwierdzenia. Sprawdź poniższe zmiany przed ponownym zezwoleniem na wykonanie:
approval_previously_approved=Wcześniej zatwierdzono:
approval_previous_sha=Poprzedni SHA-256:
approval_new_sha=Nowy SHA-256:
approval_review_subtitle=Przegląd bezpieczeństwa przepisu
approval_review_title=Przegląd przepisu przechwytywania
approval_review_description=Zmień, które wyzwalacze mogą uruchamiać ten przepis i co może on robić. „Zachowaj bez zmian” lub zamknięcie okna niczego nie zmienia.
approval_new_subtitle=Zatwierdzenie bezpieczeństwa przepisu
approval_new_title=Wykryto zewnętrzny przepis przechwytywania
approval_new_description=Nowy plik przepisu przechwytywania prosi o zarejestrowanie w Greenshocie. Przed zatwierdzeniem przejrzyj jego szczegóły, wyzwalacze i kroki wykonania.
approval_details_title=Szczegóły przepisu
approval_details_builtin_description=Co robi ten wbudowany przepis i które wyzwalacze go uruchamiają.
approval_details_description=Co robi ten przepis i co dla niego zatwierdzono. Tutaj nie można niczego zmienić, użyj do tego opcji Przejrzyj w ustawieniach lub Uprawnienia w menedżerze przepisów.
approval_ext_validation_failed=Walidacja automatycznego kroku nie powiodła się
approval_ext_validation_description=Greenshot nie mógł użyć tego automatycznego kroku, ponieważ zawiera on błędy. Przejrzyj poniższe szczegóły:
approval_ext_details_title=Szczegóły automatycznego kroku
approval_ext_details_description=Co robi ten automatyczny krok, które przepisy zmienia i co dla niego zatwierdzono.
approval_ext_ai_subtitle=Automatyczny krok zaproponowany przez narzędzie AI
approval_ext_ai_title=Narzędzie AI proponuje automatyczny krok
approval_ext_ai_description=Ten automatyczny krok napisało narzędzie AI. Zmienia on inne przepisy, w tym wbudowane: sprawdź poniżej które i co dodaje. Początkowo jest wyłączony, włącz go w Ustawienia > Przepisy.
approval_ext_modified_subtitle=Wykryto modyfikację automatycznego kroku
approval_ext_modified_title=Automatyczny krok zmieniony poza Greenshotem
approval_ext_modified_description=Ten automatyczny krok był już wcześniej zatwierdzony, ale od tego czasu jego plik został zmieniony poza Greenshotem. Dopóki nie zatwierdzisz zmian, nie zmienia on żadnego przepisu.
approval_ext_review_title=Przegląd automatycznego kroku
approval_ext_review_description=Zmień, co może robić ten automatyczny krok. „Zachowaj bez zmian” lub zamknięcie okna niczego nie zmienia.
approval_ext_own_description=Ten automatyczny krok został zapisany w edytorze przepisów. Większość zmian jest zatwierdzana bez pytania, ale ta wymaga Twojej decyzji: {0}
approval_ext_new_subtitle=Zatwierdzenie automatycznego kroku
approval_ext_new_title=Wykryto plik automatycznego kroku
approval_ext_new_description=Plik chce dodać automatyczny krok do innych przepisów, w tym wbudowanych. Przed zatwierdzeniem sprawdź, które przepisy zmienia i co dodaje.
approval_ext_reach_title=Zmienia inne przepisy
approval_ext_reach_text=Automatyczny krok dodaje swoje kroki do innych przepisów, w tym wbudowanych. Nie ma własnych wyzwalaczy.
