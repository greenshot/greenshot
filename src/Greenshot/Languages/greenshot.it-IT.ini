done=Questo è tutto ciò che ti serve per iniziare. Greenshot ti aspetta accanto all'orologio, e tutto il resto può essere modificato nelle impostazioni quando vuoi.
done_title=È tutto pronto
intro=In pochi passaggi vedrai come funziona la cattura, e Greenshot verifica che tutto sia configurato correttamente.
setup_onedrive=OneDrive si appropria del tasto Stamp per salvare da sé le immagini.
