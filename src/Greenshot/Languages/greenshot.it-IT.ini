thanks=Grazie per aver installato Greenshot! Ora è in esecuzione e ti aspetta nell'area di notifica, accanto all'orologio.
tip1=Durante la cattura, premi Spazio per passare dalla selezione di una regione alla cattura di una finestra e viceversa.
tip2=Durante la cattura, i tasti freccia spostano il cursore di un pixel alla volta, con Ctrl di dieci pixel.
tip3=Premi Z durante la cattura per visualizzare o nascondere la lente di ingrandimento, per selezioni al pixel.
tip4=Premi M durante la cattura per visualizzare o nascondere il cursore del mouse nell'immagine.
tip5=Premi F1 durante la cattura per vedere tutti i tasti che puoi usare.
tip6=Hai cambiato idea? Esc annulla una cattura.
tip7=Gestione immagini può pixelizzare o sfumare le parti di un'immagine che nessun altro deve vedere.
tip8=Numera i passaggi di una guida con il conteggio di Gestione immagini.
tip9=Nelle impostazioni scegli la cartella e il modello nome file delle immagini salvate.
tip10=Greenshot è gratuito e open source, realizzato da volontari. Se ti è utile, parlane ai tuoi amici.
tip_next=Un altro suggerimento
tip_notification=Hai chiuso una notifica di Greenshot? Ti aspetta nel centro notifiche di Windows: un clic su di essa ti permette di scegliere di nuovo dove va la cattura, anche dopo la chiusura di Greenshot.
tip_title=Lo sapevi?
