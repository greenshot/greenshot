setup_tray_fix=Visualizzala accanto all'orologio
setup_tray_hidden=Windows nasconde l'icona di Greenshot dietro la freccia (^) accanto all'orologio. Greenshot può visualizzarla accanto all'orologio per te, oppure puoi attivarla tu in "Altre icone della barra delle applicazioni" nelle impostazioni della barra delle applicazioni.
setup_tray_ok=L'icona di Greenshot è visualizzata accanto all'orologio.
