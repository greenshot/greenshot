hotkeys_onedrive_title=Verifica appropriazione scorciatoie da parte di Microsoft OneDrive
hotkeys_onedrive_disable_btn=🚫 Disattiva intercettazione immagini da parte di OneDrive
hotkeys_onedrive_desc=OneDrive ha un'impostazione 'Salva automaticamente in OneDrive gli screenshot acquisiti'. Quando è attiva, OneDrive registra il tasto Stamp prima di Greenshot. Il pulsante qui sopra aggiorna il file delle impostazioni di OneDrive e il registro per disattivare questo comportamento.
