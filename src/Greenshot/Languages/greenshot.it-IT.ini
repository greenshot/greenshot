hotkeys_snipping_title=Appropriazione da parte dello Strumento di cattura di Windows 10 / 11
hotkeys_snipping_disable_btn=🚫 Disattiva appropriazione da parte dello Strumento di cattura
hotkeys_snipping_settings_btn=⚙️ Apri impostazioni tastiera di Windows
hotkeys_snipping_desc=Negli aggiornamenti recenti di Windows 11, Microsoft ha attivato in modo predefinito 'Usa il tasto Stamp per aprire lo Strumento di cattura'. Questo intercetta il tasto Stamp prima che qualsiasi strumento desktop possa gestirlo. Disattivarlo ripristina il normale funzionamento del tasto Stamp.
hotkeys_snipping_status_disabled=L'appropriazione del tasto Stamp da parte dello Strumento di cattura di Windows è disattivata (OK).
hotkeys_snipping_status_enabled=L'appropriazione del tasto Stamp da parte dello Strumento di cattura di Windows è attualmente ATTIVA!
hotkeys_snipping_status_na=L'appropriazione da parte dello Strumento di cattura non si applica a questa versione di Windows.
hotkeys_snipping_success=Appropriazione del tasto Stamp da parte dello Strumento di cattura disattivata correttamente nel registro di Windows.
hotkeys_dropbox_title=Condivisione immagini di Dropbox
hotkeys_dropbox_desc=Dropbox ha una funzione 'Condividi screenshot con Dropbox' in Preferenze Dropbox > Backup. Quando è attiva, Dropbox si appropria di Stamp e Alt+Stamp all'avvio del sistema. Se le scorciatoie tastiera non rispondono, apri Preferenze Dropbox, vai su Backup e deseleziona 'Condividi screenshot con Dropbox'.
