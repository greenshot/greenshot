tip3=Притисните Z током сликања да бисте приказали или сакрили лупу, за избор до пиксела.
tip4=Притисните M током сликања да бисте приказали или сакрили показивач миша на снимку екрана.
tip5=Притисните F1 током сликања да бисте видели све тастере које можете користити.
tip6=Предомислили сте се? Esc отказује сликање.
tip7=Уређивач може да пикселизује или замагли делове снимка екрана које нико други не сме да види.
tip8=Нумеришите кораке упутства бројачем у уређивачу.
