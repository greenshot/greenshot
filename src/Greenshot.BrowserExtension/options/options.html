<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenshot Companion Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 16px;
      color: #202124;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .setting-row:last-child {
      margin-bottom: 0;
    }
    .setting-label {
      font-weight: 500;
      font-size: 13px;
    }
    .setting-desc {
      font-size: 12px;
      color: #5f6368;
      margin-top: 2px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #1a73e8;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #dadce0;
      background: white;
      font-size: 13px;
    }
    .status-box {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 4px;
      background-color: #e8f0fe;
      color: #1a73e8;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h2>Greenshot Companion Settings</h2>

  <div class="section">
    <div class="setting-row">
      <div>
        <div class="setting-label">QA Tab URL Tracking</div>
        <div class="setting-desc">Report active browser tab URL changes to Greenshot for automatic capture organization.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="chkTrackUrls" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="setting-row">
      <div>
        <div class="setting-label">Capture Format</div>
        <div class="setting-desc">Image compression format sent to Greenshot.</div>
      </div>
      <select id="selFormat">
        <option value="png">PNG (Lossless)</option>
        <option value="jpeg">JPEG (Compressed)</option>
      </select>
    </div>
  </div>

  <div class="status-box" id="savedIndicator">Settings saved.</div>

  <script src="options.js"></script>
</body>
</html>
